        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V3CompaniesEnrichRequest'
            example:
              ids:
              - '16303253'
              - '12790225'
              reveal:
              - employeesByLocation
              - employeesByDepartment
              - employeesBySeniority
              - competitors
