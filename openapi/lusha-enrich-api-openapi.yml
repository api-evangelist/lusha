info:
  title: Lusha API Documentation Enrich API
  version: ''
  x-logo:
    url: https://www.lusha.com/logo.png
  license:
    name: Proprietary
    url: https://lusha.com/legal/terms
  description: '**This is the Lusha API V3 documentation.**


    V3 introduces a new search-then-enrich pattern, bulk operations, AI-powered lookalikes, and richer filter capabilities.'
  contact:
    name: Lusha Support
    url: https://api.lusha.com
    email: support@lusha.com
  termsOfService: https://lusha.com/legal/terms
  x-privacy-policy:
    name: Privacy Policy
    url: https://lusha.com/legal/privacy-notice/
servers:
- url: https://api.lusha.com
  description: Production server
security:
- ApiKeyAuth: []
tags:
- name: Enrich
  description: '**Enrich APIs:** Retrieve full profile data for contacts or companies by ID.


    Pass IDs from Search results to reveal emails, phones, and full firmographic data.


    > **Billing:** Charged per revealed field via per-datapoint pricing (`revealEmail`, `revealPhone`, `reveal_company`).'
  x-tag-expanded: true
paths:
  /v3/contacts/enrich:
    post:
      tags:
      - Enrich
      summary: Enrich Contacts
      operationId: enrichContacts
      description: 'Reveal full contact data for contacts you''ve already found via Search Contacts.


        Pass up to 100 contact `ids` (from the search response). Use the `reveal` field to control what gets unlocked:

        - `emails` — work and personal email addresses

        - `phones` — mobile and direct phone numbers

        - Omit `reveal` to get both by default


        ---


        ### Waterfall Reveal

        Fall through to your enabled third-party providers when Lusha''s own data has no match, for extra reach on hard-to-match contacts.


        If **Data Waterfall** is enabled on your account, with specific providers turned on under **Account > Waterfall**, the waterfall runs automatically on every Enrich Contacts call - you don''t need to pass anything to trigger it.


        Pass `waterfallEnabled: false` to opt a specific call out:


        ```json

        "reveal": ["emails", "phones"],

        "waterfallEnabled": false

        ```


        - `reveal` controls **which fields** come back.

        - `waterfallEnabled` controls whether the waterfall runs for this call at all. Defaults to `true` whenever Data Waterfall is enabled on your account; pass `false` to disable it just for this call.

        - Provider order isn''t configurable - Lusha manages that internally.

        - If Data Waterfall is off or no providers are enabled on your account, `waterfallEnabled` has no effect either way.

        ---

        > **Tip:** If `canReveal.credits` is `0` in the search response, that data has already been revealed for your account — re-enriching it is free.


        > **Billing:** Charged per revealed field (email or phone) via per-datapoint pricing.


        > **Persisting to a table:** Pass `tableId` to also add these contacts to an existing table and populate the Work email / Phone columns. See Contacts Tables.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V3ContactsEnrichRequest'
            examples:
              standard:
                summary: Standard reveal (waterfall runs automatically if enabled on your account)
                value:
                  ids:
                  - '4389064654'
                  - '4389064624'
                  reveal:
                  - emails
                  - phones
              waterfallDisabled:
                summary: Opt this call out of the waterfall
                value:
                  ids:
                  - '4389064654'
                  - '4389064624'
                  reveal:
                  - emails
                  - phones
                  waterfallEnabled: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V3ContactsEnrichResponse'
              example:
                requestId: 71581363-f73d-46e1-9115-ecbd771b964b
                results:
                - id: '4389064654'
                  firstName: Daniel
                  lastName: Turgeman
                  fullName: Daniel Turgeman
                  jobTitle:
                    title: Technical Product Manager
                    departments:
                    - Product
                    seniority: Manager
                  location:
                    country: Israel
                    countryIso2: IL
                    city: Tel Aviv
                    continent: Asia
                    coordinates:
                    - 34.78057098388672
                    - 32.08087921142578
                    isEuContact: false
                  tags: []
                  emails:
                  - email: daniel.t@lusha.com
                    type: work
                    confidence: A+
                    updateDate: '2026-04-23'
                  phones: []
                  company:
                    id: '16303253'
                    name: Lusha
                    domain: www.lusha.com
                    industry: Technology, Information & Media
                  socialLinks:
                    linkedin: https://www.linkedin.com/in/daniel-turgeman-49676b161
                  previousEmployment: []
                  updateDate: '2026-04-23'
                billing:
                  creditsCharged: 2
                  resultsReturned: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v3/companies/enrich:
    post:
      tags:
      - Enrich
      summary: Enrich Companies
      operationId: enrichCompanies
      description: 'Reveal full company data for companies you''ve already found via Search Companies.


        Pass up to 100 company `ids` (from the search response). Each enriched result includes:

        - Firmographics: size, revenue range, year founded, company type

        - Industry: primary industry, sub-industry, SIC/NAICS codes

        - Locations: HQ and additional office sites

        - Technologies, funding rounds, buyer intent topics

        - LinkedIn followers, logo URL, social links


        > **Billing:** Charged per successful result via the `reveal_company` action.


        > **Persisting to a table:** Pass `tableId` to also add these companies to an existing table and populate the relevant enrichment columns. See Companies Tables.'
