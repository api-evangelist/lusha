openapi: 3.2.0
info:
  title: Lusha API Documentation Contact Filters API
  version: ''
  x-logo:
    url: https://www.lusha.com/logo.png
  license:
    name: Proprietary
    url: https://lusha.com/legal/terms
  description: ⚠️ **This version is soon to be deprecated.** Please migrate to V3.
  contact:
    name: Lusha Support
    url: https://api.lusha.com
    email: support@lusha.com
  termsOfService: https://lusha.com/legal/terms
  x-privacy-policy:
    name: Privacy Policy
    url: https://lusha.com/legal/privacy-notice/
servers:
- url: https://api.lusha.com
  description: Production server
security:
- ApiKeyAuth: []
tags:
- name: Contact Filters
  description: Available filters for contact searches
  x-parent-tag: Prospecting
paths:
  /prospecting/filters/contacts/departments:
    get:
      tags:
      - Contact Filters
      summary: Departments
      description: Get list of available departments for contact filtering
      operationId: getContactDepartments
      responses:
        '200':
          description: List of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
              - Business Development
              - Consulting
              - Engineering
              - Marketing
        '401':
          $ref: '#/components/responses/Unauthorized'
  /prospecting/filters/contacts/seniority:
    get:
      tags:
      - Contact Filters
      summary: Seniority
      description: Get list of available seniority levels for contact filtering
      operationId: getContactSeniority
      responses:
        '200':
          description: List of seniority levels
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
              - id: 10
                name: founder
              - id: 9
                name: c-suite
              - id: 8
                name: vice president
        '401':
          $ref: '#/components/responses/Unauthorized'
  /prospecting/filters/contacts/existing_data_points:
    get:
      tags:
      - Contact Filters
      summary: Data Points
      description: Get list of available data points for contact filtering
      operationId: getContactDataPoints
      responses:
        '200':
          description: List of data points
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
              - phone
              - work_email
              - mobile_phone
              - direct_phone
        '401':
          $ref: '#/components/responses/Unauthorized'
  /prospecting/filters/contacts/all_countries:
    get:
      tags:
      - Contact Filters
      summary: Countries
      description: Get list of all available countries for contact filtering
      operationId: getContactCountries
      responses:
        '200':
          description: List of countries with codes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CountryFilter'
              example:
              - name: United States
                code: US
              - name: United Kingdom
                code: GB
        '401':
          $ref: '#/components/responses/Unauthorized'
  /prospecting/filters/contacts/locations:
    post:
      tags:
      - Contact Filters
      summary: Locations
      description: Search for locations by text for contact filtering
      operationId: searchContactLocations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationSearchRequest'
            example:
              text: un
      responses:
        '200':
          description: Matching locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationFilter'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    ErrorResponse:
      type: object
      required:
      - statusCode
      - message
      properties:
        statusCode:
          type: integer
          description: HTTP status code
          example: 400
        message:
          type: string
          description: Error message
          example: Validation failed
        errors:
          type: array
          items:
            type: string
          description: Detailed error messages (optional, only for validation errors)
          example:
          - 'entityType must be one of: contact, company'
    LocationFilter:
      type: object
      properties:
        continent:
          type: string
          example: North America
        country:
          type: string
          example: United States
        city:
          type: string
          example: New York
        state:
          type: string
          example: New York
        country_grouping:
          type: string
          example: na
    LocationSearchRequest:
      type: object
      properties:
        text:
          type: string
          description: Search text for location
          example: un
      required:
      - text
    CountryFilter:
      type: object
      properties:
        name:
          type: string
          example: United States
        code:
          type: string
          example: US
      required:
      - name
      - code
  responses:
    Unauthorized:
      description: Unauthorized - invalid or missing API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 401
            message: Invalid API key
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: api_key
      description: 'Your Lusha API key. You can find this in your Lusha dashboard under API settings.


        Include this key in the `api_key` header for all requests.

        '
