    CompaniesBulkRequest:
      type: object
      properties:
        companies:
          type: array
          items:
            $ref: '#/components/schemas/CompanyBulkRequest'
        signals:
          type: array
          items:
            type: string
            enum:
            - allSignals
            - websiteTrafficIncrease
            - websiteTrafficDecrease
            - itSpendIncrease
            - itSpendDecrease
            - headcountIncrease1m
            - headcountDecrease1m
            - headcountIncrease3m
            - headcountDecrease3m
            - headcountIncrease6m
            - headcountDecrease6m
            - headcountIncrease12m
            - headcountDecrease12m
            - surgeInHiring
            - surgeInHiringByDepartment
            - surgeInHiringByLocation
            - riskNews
            - commercialActivityNews
            - corporateStrategyNews
            - financialEventsNews
            - peopleNews
            - marketIntelligenceNews
            - productActivityNews
          example:
          - surgeInHiringByLocation
        signalsStartDate:
          type: string
          format: date
          example: '2025-03-01'
        signalsFilters:
          type: object
          description: 'Optional filters to narrow signal results within the requested signal types.

            - Multi-value filters use **OR** logic

            - Filter values are **not** case-sensitive

            - Unrecognized values are **silently ignored**

            - `state` without `country` in `hiringByLocations` returns HTTP **400**

