  parameters:
    email:
      name: email
      in: query
      description: The email address of the person
      schema:
        type: string
      example: dustin@lusha.com
    revealEmails:
      name: revealEmails
      in: query
      description: 'Set `revealEmails=true` to retrieve only the email address of the contact.

        '
      schema:
        type: boolean
        default: true
      example: true
    personId:
      name: personId
      in: query
      description: The unique person identifier in Lusha
      schema:
        type: string
      example: '4183886134'
    lastName:
      name: lastName
      in: query
      description: The last name of the person
      schema:
        type: string
      example: Moskovitz
    revealPhones:
      name: revealPhones
      in: query
      description: 'Set `revealPhones=true` to retrieve only the phone number of the contact.

        '
      schema:
        type: boolean
        default: true
      example: true
    linkedinUrl:
      name: linkedinUrl
      in: query
      description: The LinkedIn URL of the person
      schema:
        type: string
      example: https://www.linkedin.com/in/dustin/
    filterBy:
      name: filterBy
      in: query
      description: 'Filters results based on specific contact details. Available options:

        - `phoneNumbers`: Only return contacts with phone numbers

        - `emailAddresses`: Only return contacts with email addresses


        By default, results will include contacts with at least one contact detail.

        '
      schema:
        type: string
        enum:
        - phoneNumbers
        - emailAddresses
    refreshJobInfo:
      name: refreshJobInfo
      in: query
      description: 'Set to true to refresh and update the job details for the person.

        This ensures that outdated job information is replaced with the most recent data.

        '
      schema:
        type: boolean
        default: false
      example: true
    firstName:
      name: firstName
      in: query
      description: The first name of the person
      schema:
        type: string
      example: Dustin
    partialProfile:
      name: partialProfile
      in: query
      description: 'Search for a single contact with the option to receive a partial profile.

        '
      required: false
      schema:
        type: boolean
        default: false
      example: true
    signals:
      name: signals
      in: query
      description: 'Array of signal types to retrieve for the contact.

        - `allSignals`: All available signal types

        - `promotion`: Promotion signals

        - `companyChange`: Company change signals

        '
      schema:
        type: array
        items:
          type: string
          enum:
          - allSignals
          - promotion
          - companyChange
      example:
      - promotion
    companyDomain:
      name: companyDomain
      in: query
      description: The domain name of the company
      schema:
        type: string
      example: lusha.com
    companyName:
      name: companyName
      in: query
      description: The name of the company the person works at
      schema:
        type: string
      example: Lusha
    signalsStartDate:
      name: signalsStartDate
      in: query
      description: 'Start date for signal retrieval in YYYY-MM-DD format. Defaults to 6 months ago if not specified.

        '
      schema:
        type: string
        format: date
      example: '2025-03-01'
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: api_key
      description: 'Your Lusha API key. You can find this in your Lusha dashboard under API settings.


        Include this key in the `api_key` header for all requests.

        '
