                    - websiteTrafficDecrease
                    - itSpendIncrease
                    - itSpendDecrease
                    - headcountIncrease1m
                    - headcountDecrease1m
                    - headcountIncrease3m
                    - headcountDecrease3m
                    - headcountIncrease6m
                    - headcountDecrease6m
                    - headcountIncrease12m
