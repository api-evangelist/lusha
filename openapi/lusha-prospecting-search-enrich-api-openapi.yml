          - type: integer
          - type: string
          example: 6
        dateYear:
          anyOf:
          - type: integer
          - type: string
          example: 2020
        expireDateMonth:
          anyOf:
          - type: integer
          - type: string
          example: 6
        expireDateYear:
          anyOf:
          - type: integer
          - type: string
          example: 2025
        linkedinCompanyId:
          type:
          - integer
          - 'null'
          example: 1441
        summary:
          type:
          - string
          - 'null'
          example: Azure fundamentals certification covering cloud concepts
        title:
          type: string
          example: 'Microsoft Certified: Azure Fundamentals'
        verifyUrl:
          type:
          - string
          - 'null'
          example: https://www.youracclaim.com/badges/5ccf865c-dd6e-4dcc-9184-c8999d31f83d
    ErrorResponse:
      type: object
      required:
      - statusCode
      - message
      properties:
        statusCode:
          type: integer
          description: HTTP status code
          example: 400
        message:
          type: string
          description: Error message
          example: Validation failed
        errors:
          type: array
          items:
            type: string
          description: Detailed error messages (optional, only for validation errors)
          example:
          - 'entityType must be one of: contact, company'
    CompanyLocationFilter2:
      type: object
      description: 'Site-level office location filter. At least `country` is required.

        '
      required:
      - country
      properties:
        country:
          type: string
          example: United States
        state:
          type: string
          example: California
    ContactSearchResponse:
      type: object
      properties:
        requestId:
          type: string
          description: The unique request ID used for subsequent enrichment requests
        currentPage:
          type: number
          description: The current page of the search results
        pageLength:
          type: number
          description: The number of results on the page
        totalResults:
          type: number
          description: The total number of search results
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ContactSearchData'
    PaginationParams:
