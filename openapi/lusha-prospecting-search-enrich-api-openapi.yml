openapi: 3.2.0
info:
  title: Lusha API Documentation Prospecting - Search & Enrich API
  version: ''
  x-logo:
    url: https://www.lusha.com/logo.png
  license:
    name: Proprietary
    url: https://lusha.com/legal/terms
  description: ⚠️ **This version is soon to be deprecated.** Please migrate to V3.
  contact:
    name: Lusha Support
    url: https://api.lusha.com
    email: support@lusha.com
  termsOfService: https://lusha.com/legal/terms
  x-privacy-policy:
    name: Privacy Policy
    url: https://lusha.com/legal/privacy-notice/
servers:
- url: https://api.lusha.com
  description: Production server
security:
- ApiKeyAuth: []
tags:
- name: Prospecting - Search & Enrich
  description: With Lusha's Prospecting API, you can query Lusha's extensive database based on specific criteria (such as job title, seniority, location, and more) to retrieve detailed contact and company information.
  x-tag-expanded: true
paths:
  /prospecting/contact/search:
    post:
      tags:
      - Prospecting - Search & Enrich
      summary: Search Contacts
      description: 'Search for contacts using various filters. This is step 2 of the prospecting process.


        *Endpoint*: **(POST) https://api.lusha.com/prospecting/contact/search**

        ---

        ##### Signal Filtering (Premium Feature)

        Filter contacts by signal types to find prospects at key career moments.


        > **Note:** This is a premium feature. Credits are charged for each signal type that returns results.


        ---

        ##### DNC Filtering (Scale Feature)

        Use `excludeDnc: true` at the top level of the request body to filter out contacts whose phone numbers are all marked Do Not Call.

        - Contacts with **at least one callable phone** appear in results - Only callable phones are shown — DNC phones are hidden - Contacts with **only DNC phones** are excluded entirely

        > **Note**: Returns **403** on unsupported plans.'
      operationId: searchProspectingContacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactSearchRequest'
            examples:
              basicContactSearch:
                summary: Basic contact search with filters
                value:
                  pages:
                    page: 0
                    size: 20
                  filters:
                    contacts:
                      include:
                        departments:
                        - Engineering & Technical
                        - Marketing
                        seniority:
                        - 4
                        - 5
                        existing_data_points:
                        - phone
                        - work_email
                        - mobile_phone
                        locations:
                        - continent: North America
                          country: United States
                          city: New York
                          state: New York
                          country_grouping: na
                        signals:
                          names:
                          - allSignals
                          - promotion
                          - companyChange
                          startDate: '2025-11-01'
                      exclude:
                        departments:
                        - Human Resources
                    companies:
                      include:
                        names:
                        - Apple
                        - Microsoft
                        locations:
                        - country: United States
                        technologies:
                        - Salesforce
                        - Amazon Web Services
                        mainIndustriesIds:
                        - 4
                        - 5
                        subIndustriesIds:
                        - 101
                        intentTopics:
                        - Digital Sales
                        sizes:
                        - min: 100
                          max: 1000
                        revenues:
                        - min: 10000000
                          max: 100000000
                        sicCodes:
                        - '1011'
                        - '1021'
                        naicsCodes:
                        - '11'
                        - '21'
                      exclude: {}
              simpleExample:
                summary: Simple search example
                value:
                  pages:
                    page: 0
                    size: 10
                  filters:
                    contacts:
                      include:
                        departments:
                        - Sales
              withSearchText:
                summary: Contact search with searchText filter
                value:
                  pages:
                    page: 0
                    size: 50
                  filters:
                    contacts:
                      include:
                        searchText: Amit
                        departments:
                        - Engineering & Technical
                      exclude:
                        searchText: Ronen
                    companies:
                      include:
                        searchText: finance marketing in Germany DE
              dncFilterExample:
                summary: Exclude DNC contacts — Scale only
                value:
                  pages:
                    page: 0
                    size: 20
                  excludeDnc: true
                  filters:
                    contacts:
                      include:
                        linkedinUrls:
                        - https://www.linkedin.com/in/justin-pernitz
                        - https://www.linkedin.com/in/andrewbarrettbettcher
                        - https://www.linkedin.com/in/aitor-moreno-artola-11a2a985
                    companies: {}
              employeesInLinkedInContactExample:
                summary: Filter contacts by company LinkedIn employee count
                value:
                  pages:
                    page: 0
                    size: 20
                  filters:
                    contacts:
                      include:
                        departments:
                        - Sales
                    companies:
                      include:
                        employeesInLinkedIn:
                          min: 500
      responses:
        '200':
          description: Search results with contact IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden — DNC filter not available on your current plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 403
                message: Exclude DNC is not supported on your current plan. Please contact support or your account manager for assistance.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /prospecting/contact/enrich:
    post:
      tags:
      - Prospecting - Search & Enrich
      summary: Enrich Contacts
      description: 'Enrich contacts from search results. This is step 3 of the prospecting process.


        *Endpoint*: **(POST) https://api.lusha.com/prospecting/contact/enrich**

        ---


        ⚠️ **Important Notice - Unified Credits Plan Required**


        | Parameter | Requirement |

        |-----------|-------------|

        | `revealEmails` and `revealPhones` | Only available to customers on the **Unified Credits** pricing plan |

        | Plan Restriction | Attempting to use these parameters on other plans will result in a **403 Unauthorized** error |

        | Default Behavior | When neither parameter is used, the API returns **both email addresses and phone numbers**, if available |


        ---'
      operationId: enrichProspectingContacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactEnrichRequest'
            examples:
              basicExample:
                summary: Basic enrichment request
                value:
                  requestId: b6effae6-35b8-493d-91aa-7d3b1b7c7dc7
                  contactIds:
                  - 37b4c536-eaec-11ef-ad4b-a75f8e9e1484
              unifiedCreditsExample:
                summary: Unified Credits plan with selective reveal
                value:
                  requestId: b6effae6-35b8-493d-91aa-7d3b1b7c7dc7
                  contactIds:
                  - ddfb6966-741f-4fca-a62b-e553d4ac12f8
                  revealEmails: false
                  revealPhones: true
      responses:
        '200':
          description: Enriched contact data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactEnrichResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /prospecting/company/search:
    post:
      tags:
      - Prospecting - Search & Enrich
      summary: Search Companies
      description: 'Search for companies using various filters. This is step 2 of the prospecting process.


        *Endpoint*: **(POST) https://api.lusha.com/prospecting/company/search**

        ---


        ##### Signal Filtering (Premium Feature)

        Filter companies by signal types to identify those with recent business events and changes.


        > **Note:** This is a premium feature. Credits are charged for each signal type that returns results.'
      operationId: searchProspectingCompanies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanySearchRequest'
            examples:
              companyLocationsExample:
                summary: Filter by site-level office locations
                value:
                  pages:
                    page: 0
                    size: 20
                  filters:
                    companies:
                      include:
                        companyLocations:
                        - country: United States
                          state: California
                        - country: Germany
              employeesInLinkedInExample:
                summary: Filter by LinkedIn employee count range
                value:
                  pages:
                    page: 0
                    size: 20
                  filters:
                    companies:
                      include:
                        employeesInLinkedIn:
                          min: 100
                          max: 5000
      responses:
        '200':
          description: Search results with company IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanySearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /prospecting/company/enrich:
    post:
      tags:
      - Prospecting - Search & Enrich
      summary: Enrich Companies
      description: 'Enrich companies from search results. This is step 3 of the prospecting process.


        *Endpoint*: **(POST) https://api.lusha.com/prospecting/company/enrich**'
      operationId: enrichProspectingCompanies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyEnrichRequest'
      responses:
        '200':
          description: Enriched company data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyEnrichResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    ErrorResponse:
      type: object
      required:
      - statusCode
      - message
      properties:
        statusCode:
          type: integer
          description: HTTP status code
          example: 400
        message:
          type: string
          description: Error message
          example: Validation failed
        errors:
          type: array
          items:
            type: string
          description: Detailed error messages (optional, only for validation errors)
          example:
          - 'entityType must be one of: contact, company'
    ContactEnrichData:
      type: object
      properties:
        firstName:
          type: string
          example: Carolina
        lastName:
          type: string
          example: Portela
        fullName:
          type: string
          example: Carolina Portela
        isShown:
          type: boolean
          example: false
        jobTitle:
          type: string
          example: Solutions Engineer
        location:
          type: object
          properties:
            city:
              type: string
              example: Boston
            state:
              type: string
              example: Massachusetts
            country:
              type: string
              example: United States
            country_iso2:
              type: string
              example: US
            continent:
              type: string
              example: North America
        emailAddresses:
          type: array
          items:
            $ref: '#/components/schemas/EmailAddress'
        phoneNumbers:
          type: array
          items:
            $ref: '#/components/schemas/PhoneNumbers'
        companyId:
          type: number
          example: 3553744
        companyName:
          type: string
          example: Lusha
        socialLinks:
          type: object
          properties:
            linkedin:
              type: string
              example: https://www.linkedin.com/in/carolinaportela/
            xUrl:
              type: string
              example: https://twitter.com/carolina
        departments:
          type: array
          items:
            type: string
            example: Engineering & Technical
        seniority:
          type: array
          items:
            type: object
            properties:
              id:
                type: number
                example: 4
              value:
                type: string
                example: senior
        company:
          type: object
          properties:
            revenueRange:
              type: array
              items:
                type: number
            funding:
              $ref: '#/components/schemas/CompanyFunding'
            intent:
              $ref: '#/components/schemas/CompanyIntent'
            mainIndustry:
              type: string
            subIndustry:
              type: string
            technologies:
              type: array
              items:
                $ref: '#/components/schemas/CompanyTechnology'
        linkedinFollowersCount:
          type: integer
          example: 1250
        linkedinConnectionsCount:
          type: integer
          example: 500
        linkedinCertifications:
          type: array
          items:
            $ref: '#/components/schemas/LinkedinCertification'
        linkedinCourses:
          type: array
          items:
            $ref: '#/components/schemas/LinkedinCourse'
        linkedinAwards:
          type: array
          items:
            $ref: '#/components/schemas/LinkedinAward'
        linkedinSkills:
          type: array
          items:
            type: string
          example:
          - Microsoft Office
          - Project Management
          - Strategic Planning
    ContactSearchData:
      type: object
      properties:
        contactId:
          type: string
          description: A unique serial contact ID generated for each search response
          example: 06de9b18-516d-5512-5cb5-6ec5pb215776
        isShown:
          type: boolean
          description: Indicates whether the contact was already revealed by any of the account users
          example: false
        name:
          type: string
          description: The full name of the contact
          example: Chris Karageorge
        jobTitle:
          type: string
          description: The job title held by the person at their current company
          example: Senior Director of Technical Operations
        companyId:
          type: number
          description: A unique identifier for a Lusha company
          example: 28054532
        companyName:
          type: string
          description: The name of the company where the person currently works
          example: Lusha
        fqdn:
          type: string
          description: The fqdn of the company
          example: lusha.com
        hasCompanyEmployeesCount:
          type: boolean
        hasCompanyRevenue:
          type: boolean
        hasCompanyMainIndustry:
          type: boolean
        hasCompanySubIndustry:
          type: boolean
        hasCompanyFunding:
          type: boolean
        hasCompanyIntent:
          type: boolean
        hasCompanyTechnologies:
          type: boolean
        hasDepartment:
          type: boolean
        hasSeniority:
          type: boolean
        hasContactLocation:
          type: boolean
        hasSocialLink:
          type: boolean
        hasEmails:
          type: boolean
        hasWorkEmail:
          type: boolean
        hasPrivateEmail:
          type: boolean
        hasPhones:
          type: boolean
        hasMobilePhone:
          type: boolean
        hasDirectPhone:
          type: boolean
        hasCompanyCity:
          type: boolean
        hasCompanyCountry:
          type: boolean
        signalTypes:
          type: array
          description: Types of signals detected for this contact
          items:
            type: string
          example:
          - companyChange
          - promotion
    CompanyTechnology:
      type: object
      properties:
        name:
          type: string
          example: salesforce
      required:
      - name
    EmployeesInLinkedInFilter:
      type: object
      description: 'Filter companies by LinkedIn-reported employee count.

        Both `min` and `max` are optional — provide either or both.

        '
      properties:
        min:
          type: integer
          format: int64
          description: Minimum employee count (inclusive)
          example: 100
        max:
          type: integer
          format: int64
          description: Maximum employee count (inclusive)
          example: 5000
    PhoneNumbers:
      type: object
      properties:
        number:
          type: string
          description: The phone number
          example: '+1234567890'
        phoneType:
          type: string
          description: The type of phone number
          example: Mobile
          enum:
          - Mobile
          - Direct
          - Phone
        doNotCall:
          type: boolean
          description: Indicates whether the phone number is listed as "Do Not Call" (DNC).
          example: false
        updateDate:
          type: string
          description: The update date of the phone number
          example: '2020-01-01'
      required:
      - phoneType
      - doNotCall
      - updateDate
    CompanySearchData:
      type: object
      properties:
        id:
          type: string
          description: A unique identifier for a Lusha company
        name:
          type: string
          description: The name of the company
        fqdn:
          type: string
          description: The fqdn of the company
        description:
          type: string
          description: A description of the company
        logoUrl:
          type: string
          description: The URL of the company's logo
        hasCompanyEmployeesCount:
          type: boolean
        hasCompanyRevenue:
          type: boolean
        hasCompanyMainIndustry:
          type: boolean
        hasCompanySubIndustry:
          type: boolean
        hasCompanyFunding:
          type: boolean
        hasCompanyIntent:
          type: boolean
        hasCompanyTechnologies:
          type: boolean
        hasCompanyCity:
          type: boolean
        hasCompanyCountry:
          type: boolean
        signalTypes:
          type: array
          description: Types of signals detected for this company
          items:
            type: string
    CompanyLocationFilter2:
      type: object
      description: 'Site-level office location filter. At least `country` is required.

        '
      required:
      - country
      properties:
        country:
          type: string
          example: United States
        state:
          type: string
          example: California
    CompanyFundingRound:
      type: object
      properties:
        currency:
          type: string
          example: USD
        roundAmount:
          type: number
          example: 205000000
        roundType:
          type: string
          example: Private Equity Round
        roundDate:
          type: string
          example: Nov 10, 2021
      required:
      - currency
      - roundAmount
      - roundType
      - roundDate
    CompanyEnrichResponse:
      type: object
      properties:
        requestId:
          type: string
          description: The requestId used in the request
        companies:
          type: array
          items:
            $ref: '#/components/schemas/CompanyEnrichData'
    LinkedinCertification:
      type: object
      properties:
        companyId:
          type: integer
          example: 1035
        companyName:
          type: string
          example: Microsoft
        credentialId:
          type: string
          example: abc123
        dateMonth:
          anyOf:
          - type: integer
          - type: string
          example: 6
        dateYear:
          anyOf:
          - type: integer
          - type: string
          example: 2020
        expireDateMonth:
          anyOf:
          - type: integer
          - type: string
          example: 6
        expireDateYear:
          anyOf:
          - type: integer
          - type: string
          example: 2025
        linkedinCompanyId:
          type:
          - integer
          - 'null'
          example: 1441
        summary:
          type:
          - string
          - 'null'
          example: Azure fundamentals certification covering cloud concepts
        title:
          type: string
          example: 'Microsoft Certified: Azure Fundamentals'
        verifyUrl:
          type:
          - string
          - 'null'
          example: https://www.youracclaim.com/badges/5ccf865c-dd6e-4dcc-9184-c8999d31f83d
    LocationFilter:
      type: object
      properties:
        continent:
          type: string
          example: North America
        country:
          type: string
          example: United States
        city:
          type: string
          example: New York
        state:
          type: string
          example: New York
        country_grouping:
          type: string
          example: na
    CompanySurgeInHiringByLocationSignal:
      type: object
      properties:
        signalId:
          type: string
          example: '1503907'
        companyId:
          type: string
          example: '3416'
        country:
          type: string
          example: United States
        state:
          type: string
          example: California
        signalDate:
          type: string
          format: date
          example: '2025-06-15'
        newJobsPostedLast4Weeks:
          type: number
          example: 20
        historicalAvg:
          type: number
          example: 8
        changeRatePercent:
          type: number
          example: 150
        companyName:
          type: string
          example: Lusha
        domain:
          type: string
          example: lusha.com
    CompanyNewsSignal:
      type: object
      properties:
        companyId:
          type: string
          example: '33222678'
        companyName:
          type: string
          example: Lusha
        domain:
          type: string
          example: lusha.com
        signalId:
          type: string
          example: '1503910'
        eventType:
          type: string
          example: partnership
        eventSummary:
          type: string
          example: Lusha announced a strategic partnership with Salesforce.
        articlePublishedDate:
          type: string
          format: date
          example: '2025-06-15'
        articleTitle:
          type: string
          example: Lusha Partners with Salesforce
        articleHighlight:
          type: string
          example: The partnership enables Salesforce users to access Lusha data directly within their CRM.
        eventEffectiveDate:
          type: string
          format: date
          example: '2025-06-10'
        articleUrl:
          type: string
          format: uri
          example: https://example.com/lusha-salesforce-partnership
    CompanySurgeInHiringByDepartmentSignal:
      type: object
      properties:
        signalId:
          type: string
          example: '1503906'
        companyId:
          type: string
          example: '3416'
        department:
          type: string
          example: Engineering
        signalDate:
          type: string
          format: date
          example: '2025-06-15'
        newJobsPostedLast4Weeks:
          type: number
          example: 15
        historicalAvg:
          type: number
          example: 5
        changeRatePercent:
          type: number
          example: 200
        companyName:
          type: string
          example: Lusha
        domain:
          type: string
          example: lusha.com
    EmailAddress:
      type: object
      properties:
        email:
          type: string
          description: The email address (alternative to 'address')
          example: dustin@lusha.com
        address:
          type: string
          description: The email address (alternative to 'email')
          example: dustin@lusha.com
        emailType:
          type: string
          description: The type of email address (alternative to 'type')
          example: work
          enum:
          - work
          - private
        emailConfidence:
          type: string
          description: The confidence level of the email address
          example: A+
        updateDate:
          type: string
          description: The update date of the email address
          example: '2020-01-01'
    CompanyEnrichData:
      type: object
      properties:
        id:
          type: number
          example: 33222678
        name:
          type: string
          example: Lusha
        companySize:
          type: object
          properties:
            min:
              type: number
              example: 11
            max:
              type: number
              example: 50
            employees_in_linkedin:
              type: number
              example: 32
        employees:
          type: string
          example: 10001 - 100000
        revenueRange:
          type: array
          items:
            type: number
          example:
          - 10000000
          - 50000000
        fqdn:
          type: string
          example: www.lusha.com
        description:
          type: string
          example: Lusha is the sales intelligence platform designed to help businesses get their next customers.
        domains:
          type: object
          properties:
            email:
              type: string
              example: lusha.com
            homepage:
              type: string
              example: lusha.com
        logoUrl:
          type: string
          example: https://logo.lusha.co/logo.jpg
        industryTags:
          type: array
          items:
            type: string
            example:
            - Technology, Information & Media
            - Software Development
        stateCode:
          type: string
          example: MA
        social:
          type: object
          properties:
            linkedin:
              type: string
              example: https://www.linkedin.com/company/lushadata
            crunchbase:
              type: string
              example: https://www.crunchbase.com/organization/lusha
        city:
          type: string
          example: Boston
        state:
          type: string
          example: Massachusetts
        country:
          type: string
          example: United States
        countryIso2:
          type: string
          example: US
        continent:
          type: string
          example: North America
        rawLocation:
          type: string
          example: 800 Boylston St; Suite 1410; Boston, Massachusetts 02199, US
        coordinates:
          type: array
          items:
            type: number
          example:
          - -71.05976867675781
          - 42.358428955078125
        specialities:
          type: array
          items:
            type: string
          example:
          - data enrichment
          - sales intelligence
          - lead generation
          - prospecting
        mainIndustry:
          type: string
          example: Technology, Information & Media
        subIndustry:
          type: string
          example: Software Development
        linkedinFollowers:
          type: integer
          example: 1950
        emailDomain:
          type: string
          example: bitcoinromania.ro
        companyLocations:
          type: array
          description: All known company locations (not just HQ)
          items:
            type: object
            properties:
              city:
                type: string
              continent:
                type: string
              country:
                type: string
              country_iso2:
                type: string
              location_coordinates:
                type: array
                items:
                  type: number
              state:
                type:
                - string
                - 'null'
              state_code:
                type:
                - string
                - 'null'
