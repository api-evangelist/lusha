openapi: 3.2.0
info:
  title: Lusha Webhooks API
  version: ''
  contact:
    name: Lusha Support
    url: https://api.lusha.com
    email: support@lusha.com
  license:
    name: Proprietary
    url: https://lusha.com/legal/terms
  termsOfService: https://lusha.com/legal/terms
  x-logo:
    url: https://www.lusha.com/logo.png
  x-privacy-policy:
    name: Privacy Policy
    url: https://lusha.com/legal/privacy-notice/
  description: 'Operations tagged Webhooks across 2 of this provider''s published API definitions: lusha-openapi.yml, lusha-v2-openapi.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.lusha.com
  description: Production server
security:
- ApiKeyAuth: []
tags:
- name: Webhooks
  description: Subscribe to real-time notifications when contacts change jobs or companies experience key business events.
  x-tag-expanded: true
paths:
  /api/subscriptions:
    post:
      tags:
      - Webhooks
      summary: Create Subscription
      description: 'Creates one or more webhook subscriptions for real-time signal notifications.


        **Delivery & Reliability:**

        - Webhooks are delivered with automatic retry on failures

        - Maximum 3 retry attempts with exponential backoff

        - Subscriptions auto-disable after max retries exceeded

        - All deliveries are logged in audit logs


        > **Note:** Your webhook endpoint must respond with a proper acknowledgment.

        See Client Response Format below for details.


        > **Limit:** Maximum 25 subscriptions per request


        *Endpoint*: **(POST) https://api.lusha.com/api/subscriptions**


        ---


        ### Webhook Payload You''ll Receive

        When a signal is triggered, this payload is sent to your webhook URL:

        ```json

        {

        "id": "f3b87e05-0402-4f3e-8e26-6a38fd0ad62c",

        "type": "promotion",

        "entityType": "contact",

        "entityId": "4158887495",

        "subscriptionId": "507f1f77bcf86cd799439011",

        "data": {

        "personId": 4158887495,

        "currentCompanyId": 40823133,

        "currentCompanyName": "OMG Hospitality Group LLC",

        "currentDomain": "omghospitalitygroup.com",

        "currentTitle": "Bartender",

        "currentDepartments": [

        { "id": 7, "value": "Other" }

        ],

        "previousCompanyName": "First Watch Restaurants",

        "previousDomain": "firstwatch.com",

        "signalDate": "2025-07-01"

        },

        "timestamp": "2026-01-14T16:16:35.841Z",

        "billing": {

        "creditsCharged": 1

        }

        }

        ```

        **Example — Company News Signal:**

        ```json

        {

        "id": "a7c92f14-1234-4b3e-9d22-8b4fe1d0bc45",

        "type": "commercialActivityNews",

        "entityType": "company",

        "entityId": "33222678",

        "subscriptionId": "507f1f77bcf86cd799439011",

        "data": {

        "companyId": "33222678",

        "companyName": "Lusha",

        "domain": "lusha.com",

        "signalId": "1503910",

        "eventType": "partnership",

        "eventSummary": "Lusha announced a strategic partnership with Salesforce.",

        "articlePublishedDate": "2025-06-15",

        "articleTitle": "Lusha Partners with Salesforce",

        "articleHighlight": "The partnership enables Salesforce users to access Lusha data directly within their CRM.",

        "eventEffectiveDate": "2025-06-10",

        "articleUrl": "https://example.com/lusha-salesforce-partnership"

        },

        "timestamp": "2026-01-14T16:16:35.841Z",

        "billing": {

        "creditsCharged": 1

        }

        }

        ```


        **Headers Included:**


        | Header | Description |

        |--------|-------------|

        | `X-Lusha-Signature` | HMAC-SHA256 signature for verification |

        | `X-Lusha-Timestamp` | Unix timestamp of the request |

        | `Content-Type` | application/json |

        | `User-Agent` | Lusha-Webhooks/1.0 |


        ---

        ⚠️ **Important:** Ensure your account has a webhook secret before creating subscriptions.

        Create one via the Regenerate Account Secret endpoint.


        ---


        ### Client Response Format (Required)


        When your webhook endpoint receives a delivery, it **must** acknowledge receipt with this response:


        **Required Response:**

        ````json

        {

        "received": true,

        "timestamp": "2026-02-05T10:30:45.123Z",

        "webhookId": "f3b87e05-0402-4f3e-8e26-6a38fd0ad62c"

        }

        ````


        Response Requirements


        | Requirement | Value |

        |-------------|-------|

        | **HTTP Status** | `201 Created` (recommended) or any `2xx` status |

        | **Content-Type** | `application/json` |

        | **Response Time** | Within 10 seconds |


        Field Descriptions & Implementation Guide


        **Field Descriptions:**

        * `received` (boolean, required): Confirmation flag - must be `true`

        * `timestamp` (string, required): ISO 8601 timestamp of receipt

        * `webhookId` (string, required): Echo the `id` from webhook payload


        **Implementation Example:**

        ```javascript

        app.post(''/webhook'', async (req, res) => {

        // 1. Verify signature

        if (!verifyWebhookSignature(req)) {

        return res.status(401).json({ error: ''Invalid signature'' });

        }


        // 2. Queue for async processing

        await queueWebhook(req.body);


        // 3. Acknowledge immediately

        res.status(201).json({

        received: true,

        timestamp: new Date().toISOString(),

        webhookId: req.body.id

        });

        ```


        **Important Notes:**

        * Return acknowledgment **before** heavy processing

        * Non-2xx responses trigger retry mechanism

        * After 3 failed retries, subscription is disabled


        ----'
      operationId: createSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
            examples:
              singleSubscription:
                summary: Create a single subscription
                value:
                  defaults:
                    entityType: contact
                    signalTypes:
                    - promotion
                    - companyChange
                    url: https://example.com/webhooks/lusha
                  subscriptions:
                  - entityId: '123456'
                    name: My Test Webhook
              multipleSubscriptions:
                summary: Create multiple subscriptions with shared URL
                value:
                  defaults:
                    entityType: contact
                    signalTypes:
                    - promotion
                    - companyChange
                    url: https://example.com/webhooks/lusha
                  subscriptions:
                  - entityId: '123'
                    name: Contact 123
                  - entityId: '456'
                    name: Contact 456
                  - entityId: '789'
                    name: Contact 789
              mixedEntityTypes:
                summary: Mixed entity types with shared URL
                value:
                  defaults:
                    signalTypes:
                    - promotion
                    - itSpendIncrease
                    url: https://example.com/webhooks/lusha
                  subscriptions:
                  - entityType: contact
                    entityId: '123'
                  - entityType: company
                    entityId: '456'
      responses:
        '201':
          description: Subscriptions created (full or partial success)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSubscriptionResponse'
              examples:
                allSuccessful:
                  summary: All subscriptions created successfully
                  value:
                    total: 3
                    successful: 3
                    failed: 0
                    results:
                    - index: 0
                      success: true
                      subscription:
                        id: 507f1f77bcf86cd799439011
                        entityType: contact
                        entityId: '123'
                        signalTypes:
                        - promotion
                        - companyChange
                        url: https://example.com/webhooks/lusha
                        name: Contact 123
                        isActive: true
                        createdAt: '2026-02-02T10:00:00.000Z'
                        updatedAt: '2026-02-02T10:00:00.000Z'
                partialSuccess:
                  summary: Some subscriptions failed (partial success)
                  value:
                    total: 3
                    successful: 2
                    failed: 1
                    results:
                    - index: 0
                      success: true
                      subscription:
                        id: 507f1f77bcf86cd799439011
                        entityType: contact
                        entityId: '123'
                        signalTypes:
                        - promotion
                        - companyChange
                        url: https://example.com/webhooks/lusha
                        name: Contact 123
                        isActive: true
                        createdAt: '2026-02-02T10:00:00.000Z'
                        updatedAt: '2026-02-02T10:00:00.000Z'
                    - index: 1
                      success: false
                      error:
                        code: DUPLICATE_SUBSCRIPTION
                        message: Subscription already exists for entity type 'contact' with entity ID '456'
        '400':
          description: Bad request - URL validation failed or invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 400
                message: Validation failed
                errors:
                - 'entityType must be one of: contact, company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden - feature not available or limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 403
                message: Maximum subscriptions limit reached for your account
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
      - Webhooks
      summary: List Subscriptions
      description: 'Returns all webhook subscriptions for your account with pagination support.


        *Endpoint*: **(GET) https://api.lusha.com/api/subscriptions**


        **Pagination:**

        - Results are sorted by `createdAt` in descending order (newest first)

        - Default limit: 10, max limit: 100

        - Use `offset` for pagination through large result sets


        > **Note:** The webhook `secret` is never returned in list responses for security.'
      operationId: listSubscriptions
      parameters:
      - name: limit
        in: query
        required: false
        description: Maximum number of results (1-100)
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
        example: 10
      - name: offset
        in: query
        required: false
        description: Number of results to skip
        schema:
          type: integer
          minimum: 0
          default: 0
        example: 0
      responses:
        '200':
          description: List of subscriptions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionListResponse'
              example:
                data:
                - id: 507f1f77bcf86cd799439011
                  entityType: contact
                  entityId: '123456'
                  signalTypes:
                  - promotion
                  - companyChange
                  url: https://example.com/webhook
                  name: My Contact Webhook
                  isActive: true
                  createdAt: '2024-01-01T00:00:00.000Z'
                  updatedAt: '2024-01-01T00:00:00.000Z'
                pagination:
                  total: 25
                  limit: 10
                  offset: 0
                  hasMore: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    servers:
    - url: https://api.lusha.com
      description: Production server
  /api/subscriptions/{id}:
    get:
      tags:
      - Webhooks
      summary: Get Subscription by ID
      description: 'Returns a single webhook subscription by ID.


        *Endpoint*: **(GET) https://api.lusha.com/api/subscriptions/{id}**'
      operationId: getSubscriptionById
      parameters:
      - name: id
        in: path
        required: true
        description: Subscription ID
        schema:
          type: string
        example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Subscription retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionWithoutSecret'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
      - Webhooks
      summary: Update Subscription
      description: 'Updates an existing webhook subscription. All fields are optional.


        *Endpoint*: **(PATCH) https://api.lusha.com/api/subscriptions/{id}**


        ---

        **Reactivating Disabled Subscriptions:**


        When setting `isActive: true` on a previously disabled subscription, the system automatically:

        - Clears the `blockReason` field

        - Clears the `blockedAt` timestamp

        - Resets the retry counter


        **Regenerating Secrets:**


        Set `regenerateSecret: true` to generate a new webhook secret. The new secret:

        - Affects **all subscriptions** for your account

        - Is only shown once in the response

        - Immediately invalidates the old secret

        ---'
      operationId: updateSubscription
      parameters:
      - name: id
        in: path
        required: true
        description: Subscription ID
        schema:
          type: string
        example: 507f1f77bcf86cd799439011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriptionRequest'
            examples:
              disableSubscription:
                summary: Disable a subscription
                value:
                  isActive: false
              updateSignals:
                summary: Change subscribed signals
                value:
                  signalTypes:
                  - promotion
                  - companyChange
              regenerateSecret:
                summary: Regenerate webhook secret
                value:
                  regenerateSecret: true
              updateUrl:
                summary: Update webhook URL
                value:
                  url: https://new-domain.com/webhooks/lusha
      responses:
        '200':
          description: Subscription updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    servers:
    - url: https://api.lusha.com
      description: Production server
  /api/subscriptions/{id}/test:
    post:
      tags:
      - Webhooks
      summary: Test Subscription
      description: 'Test a webhook subscription by sending a test signal. Supports three test modes.


        *Endpoint*: **(POST) https://api.lusha.com/api/subscriptions/{id}/test**

        ---

        **Test Modes:**

        - `direct` - Quick HTTP check only (validates URL responds correctly)

        - `kafka` - Fanout handler only (tests Kafka message processing)

        - `full` - Complete Kafka flow (default - end-to-end test)


        **Important Notes:**

        - Test deliveries do NOT consume credits

        - Test payloads use mock data

        - Useful for verifying webhook configuration before going live'
      operationId: testSubscription
      parameters:
      - name: id
        in: path
        required: true
        description: Subscription ID
        schema:
          type: string
        example: 507f1f77bcf86cd799439011
      - name: mode
        in: query
        required: false
        description: Test mode
        schema:
          type: string
          enum:
          - direct
          - kafka
          - full
          default: full
        example: full
      responses:
        '200':
          description: Test executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestSubscriptionResponse'
              example:
                subscriptionId: 507f1f77bcf86cd799439011
                subscriptionName: My Test Webhook
                url: https://example.com/webhook
                mode: full
                flowCheck:
                  success: true
                  statusCode: 200
                  durationMs: 150
                testPayload:
                  entityType: contact
                  signalType: promotion
                  data: {}
                isSuccess: true
                timestamp: '2024-01-01T00:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Subscription does not belong to your account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 403
                message: Subscription does not belong to your account
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    servers:
    - url: https://api.lusha.com
      description: Production server
  /api/subscriptions/delete:
    post:
      tags:
      - Webhooks
      summary: Delete Subscriptions
      description: 'Delete one or more webhook subscriptions. Returns detailed results for each deletion with partial success support.


        *Endpoint*: **(POST) https://api.lusha.com/api/subscriptions/delete**


        ---


        **Behavior:**

        - Each subscription is processed independently

        - Returns detailed results for each item including deleted subscription info

        - Invalid ID formats are gracefully handled and reported as NOT_FOUND

        - Duplicate IDs are automatically deduplicated

        - Deletion is permanent and cannot be undone'
      operationId: deleteSubscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ids
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 25
                  items:
                    type: string
                  description: Array of subscription IDs to delete
                  example:
                  - 507f1f77bcf86cd799439011
                  - 507f1f77bcf86cd799439012
            examples:
              singleDelete:
                summary: Delete a single subscription
                value:
                  ids:
                  - sub-123
              multipleDelete:
                summary: Delete multiple subscriptions
                value:
                  ids:
                  - sub-123
                  - sub-456
                  - sub-789
      responses:
        '200':
          description: Delete operation completed (full or partial success)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSubscriptionResponse'
              examples:
                allSuccessful:
                  summary: All subscriptions deleted successfully
                  value:
                    total: 3
                    successful: 3
                    failed: 0
                    results:
                    - index: 0
                      success: true
                      subscription:
                        id: sub-123
                        entityType: contact
                        entityId: '123'
                        name: Contact Webhook
                partialSuccess:
                  summary: Some deletions failed
                  value:
                    total: 3
                    successful: 2
                    failed: 1
                    results:
                    - index: 0
                      success: true
                      subscription:
                        id: sub-123
                        entityType: contact
                        entityId: '123'
                        name: Contact Webhook
                    - index: 1
                      success: false
                      error:
                        code: NOT_FOUND
                        message: Subscription with id 'sub-456' not found
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    servers:
    - url: https://api.lusha.com
      description: Production server
  /api/audit-logs:
    get:
      tags:
      - Webhooks
      summary: Get Audit Logs
      description: 'Retrieve webhook delivery logs for your account.


        *Endpoint*: **(GET) https://api.lusha.com/api/audit-logs**


        **What''s Logged:**

        - All webhook delivery attempts (success and failures)

        - HTTP status codes and response times

        - Error messages for failed deliveries

        - Delivery timestamps and duration metrics


        **Filtering:**

        - Filter by subscription ID to see logs for specific subscriptions

        - Filter by status to see only successes, failures, or permanent failures


        **Rate Limit:** 100 requests/minute per account


        > **Note:** Logs are retained for 90 days (successful) and 180 days (failed/DLQ)'
      operationId: getAuditLogs
      parameters:
      - name: subscriptionId
        in: query
        required: false
        description: Filter by subscription ID
        schema:
          type: string
        example: 507f1f77bcf86cd799439011
      - name: status
        in: query
        required: false
        description: Filter by delivery status
        schema:
          type: string
          enum:
          - success
          - failed
          - permanent_failure
        example: success
      - name: limit
        in: query
        required: false
        description: Maximum number of results (1-100)
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        example: 50
      - name: offset
        in: query
        required: false
        description: Number of results to skip
        schema:
          type: integer
          minimum: 0
          default: 0
        example: 0
      responses:
        '200':
          description: Audit logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogsResponse'
              example:
                data:
                - id: log-123
                  subscriptionId: sub-123
                  payloadId: payload-456
                  status: success
                  statusCode: 200
                  url: https://example.com/webhook
                  deliveredAt: '2024-01-01T00:00:00.000Z'
                  durationMs: 150
                  error: null
                pagination:
                  total: 100
                  limit: 50
                  offset: 0
                  hasMore: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    servers:
    - url: https://api.lusha.com
      description: Production server
  /api/audit-logs/stats:
    get:
      tags:
      - Webhooks
      summary: Get Audit Log Statistics
      description: 'Get delivery statistics for your account.


        *Endpoint*: **(GET) https://api.lusha.com/api/audit-logs/stats**'
      operationId: getAuditLogStats
      parameters:
      - name: subscriptionId
        in: query
        required: false
        description: Filter statistics by subscription ID
        schema:
          type: string
        example: sub-123
      responses:
        '200':
          description: Statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogStatsResponse'
              example:
                total: 1000
                success: 950
                failed: 50
                successRate: 95.00%
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    servers:
    - url: https://api.lusha.com
      description: Production server
  /api/account/secret:
    get:
      tags:
      - Webhooks
      summary: Get Account Secret
      description: 'Retrieve the current account webhook secret.


        *Endpoint*: **(GET) https://api.lusha.com/api/account/secret**'
      operationId: getAccountSecret
      responses:
        '200':
          description: Account secret retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - secret
                properties:
                  secret:
                    type: string
                    description: Current account webhook secret
                    example: whsec_abc123def456ghi789jkl012mno345pqr678stu901vwx234yz
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Account secret not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 404
                message: Account secret not found. Please generate one first.
        '500':
          $ref: '#/components/responses/InternalServerError'
    servers:
    - url: https://api.lusha.com
      description: Production server
  /api/account/secret/regenerate:
    post:
      tags:
      - Webhooks
      summary: Regenerate Account Secret
      description: 'Regenerate the account webhook secret. Affects **all subscriptions** for the account.


        *Endpoint*: **(POST) https://api.lusha.com/api/account/secret/regenerate**


        **Behavior:**

        - If a secret already exists: Replaces with new secret (old secret is invalidated)

        - If no secret exists: Creates new secret automatically


        **Important Notes:**

        - The secret is only shown once in the response. Store it securely.

        - This endpoint always succeeds (upsert operation)

        - Regenerating invalidates the old secret for **all subscriptions** (if one existed)

        - An account secret must exist before webhooks can be delivered'
      operationId: regenerateAccountSecret
      responses:
        '200':
          description: Account secret regenerated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - secret
                properties:
                  secret:
                    type: string
                    description: Newly generated account webhook secret (store securely - only shown once)
                    example: whsec_new_secret_here_abc123def456ghi789jkl012mno345
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    servers:
    - url: https://api.lusha.com
      description: Production server
  /api/subscriptions/opt-out:
    post:
      tags:
      - Webhooks
      summary: Create Opt-Out Subscription
      description: 'Subscribe to real-time notifications when a contact opts out of data processing. When a contact requests removal, Lusha sends an `OptOutWebhookPayload` to your endpoint so you can action the removal in your own systems (CRM, outreach tools, etc.).


        *Endpoint*: **(POST) https://api.lusha.com/api/subscriptions/opt-out**


        ---


        **How it works:**

        - Create one opt-out subscription per account (scoped to `contact` entity type)

        - Lusha delivers a POST request to your URL whenever a contact opts out

        - The payload includes the contact identity, opt-out date, and the specific data points (emails and/or phones) that must be removed


        **Payload you''ll receive:**

        ```json

        {

        "contactId": "987654321",

        "fullName": "Jane Doe",

        "companyName": "Acme Corp",

        "jobTitle": "Director of Product",

        "linkedinUrl": "https://www.linkedin.com/in/jane-doe",

        "contactOptOutDate": "2026-04-22 14:32:11.412",

        "contactExposureDate": "2025-08-03 09:15:47",

        "datapoints": [

