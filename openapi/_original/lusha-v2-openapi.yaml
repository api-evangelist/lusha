tags:
  - name: Enrichment
    description: >-
      **What is enrichment?**


      Enrichment is the process of adding missing or updated data to existing
      contact or company records.


      Use enrichment to:

      - Complete CRM records

      - Improve outbound accuracy and deliverability

      - Keep records current as people and companies change


      > Enrichment can be performed in real time or in bulk, depending on the
      endpoint and use case.


      **Available enrichment APIs**


      Person enrichment:

      - **Search single contact** — Enrich one contact at a time

      - **Search multiple contacts** — Bulk enrich contacts


      Company enrichment:

      - **Search a single company** — Enrich one company at a time

      - **Search multiple companies** — Bulk enrich companies
  - name: Prospecting - Search & Enrich
    description: >
      With Lusha's Prospecting API, you can query Lusha's extensive database
      based on specific criteria (such as job title, seniority, location, and
      more) to retrieve detailed contact and company information.


      The Prospecting API is designed to help you generate new records (contacts
      or companies) for your CRM system, using filters that align with your
      Ideal Customer Profile (ICP).


      This process involves three main steps:


      | Step | API | Description |

      |------|-----|-------------|

      | 1 | **Filters API** | Apply filters to refine your search *(check
      available Contact and Company filter endpoints)* |

      | 2 | **Search API** | Query Contacts or Companies using the available
      filters |

      | 3 | **Enrich API** | Get full details of Contacts and Companies from the
      search results |
    x-tag-expanded: true
  - name: Contact Filters
    description: Available filters for contact searches
    x-parent-tag: Prospecting
  - name: Company Filters
    description: Available filters for company searches
    x-parent-tag: Prospecting
  - name: Signals
    description: >-
      With Lusha's Signals API, you can enrich your contacts and companies with
      timely insights that highlight key account and prospect changes. Signals
      help you identify moments of opportunity - from job moves and promotions
      to company growth and new initiatives - so you can engage prospects and
      customers at exactly the right time. Easily integrate signal data into
      enrichment flows, CRM systems, or automation workflows to keep pipelines
      and customer records always up to date.
    x-tag-expanded: true
  - name: Lookalikes
    description: >-
      Lusha's Lookalikes API helps you discover similar contacts and companies
      based on your existing data. Get AI-powered suggestions for new prospects
      that match your ideal customer profile.


      **Contact Lookalikes** — Find similar contacts based on role, seniority,
      and industry patterns.


      **Company Lookalikes** — Discover companies with similar firmographics and
      characteristics.
    x-tag-expanded: true
  - name: Webhooks
    description: >
      Subscribe to real-time notifications when contacts change jobs or
      companies experience key business events.


      Webhooks deliver HTTP POST requests to your endpoints when signals occur -
      from promotions and job changes to company growth.


      > For a full list of available signals, refer to the **Signal Options**
      endpoint under the Signals section.

      ---

      **Key Features:**

      - Real-time contact & company signal notifications

      - Bulk subscription management (up to 25 items per request)

      - Secure delivery with HMAC-SHA256 signatures

      - Delivery monitoring with audit logs

       **Available Endpoints:**

      | Method | Endpoint | Purpose |

      |--------|----------|---------|

      | POST | `/api/subscriptions` | Create subscriptions (bulk supported) |

      | GET | `/api/subscriptions` | List all subscriptions |

      | GET | `/api/subscriptions/{id}` | Get subscription by ID |

      | PATCH | `/api/subscriptions/{id}` | Update subscription |

      | POST | `/api/subscriptions/delete` | Delete subscriptions (bulk
      supported) |

      | POST | `/api/subscriptions/{id}/test` | Test subscription delivery |

      | GET | `/api/audit-logs` | Get webhook delivery logs |

      | GET | `/api/audit-logs/stats` | Get delivery statistics |

      | GET | `/api/account/secret` | Get account webhook secret |

      | POST | `/api/account/secret/regenerate` | Regenerate account secret |


      > **Webhook Delivery Acknowledgment:** When receiving webhook deliveries
      (POST requests), your endpoint must acknowledge with a specific response
      format. See the Create Subscription endpoint for the required
      acknowledgment structure.
            ---

