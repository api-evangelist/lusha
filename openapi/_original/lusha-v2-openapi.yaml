          type: array
          minItems: 1
          maxItems: 25
          items:
            type: object
            required:
              - entityId
            properties:
              entityId:
                type: string
                maxLength: 255
                example: '123'
              entityType:
                type: string
                enum:
                  - contact
                  - company
