  /prospecting/contact/search:
    post:
      tags:
        - Prospecting - Search & Enrich
      summary: Search Contacts
      description: >
        Search for contacts using various filters. This is step 2 of the
        prospecting process.


        *Endpoint*: **(POST)  https://api.lusha.com/prospecting/contact/search**

        ---

        ##### Signal Filtering (Premium Feature)

        Filter contacts by signal types to find prospects at key career moments.

          > **Note:** This is a premium feature. Credits are charged for each signal type that returns results.

        ---

        ##### DNC Filtering (Scale Feature)

        Use `excludeDnc: true` at the top level of the request body to filter
        out contacts whose phone numbers are all marked Do Not Call.

        - Contacts with **at least one callable phone** appear in results - Only
        callable phones are shown — DNC phones are hidden - Contacts with **only
        DNC phones** are excluded entirely

        > **Note**: Returns **403** on unsupported plans.
      operationId: searchProspectingContacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactSearchRequest'
            examples:
              basicContactSearch:
                summary: Basic contact search with filters
                value:
                  pages:
                    page: 0
                    size: 20
                  filters:
                    contacts:
                      include:
                        departments:
                          - Engineering & Technical
                          - Marketing
                        seniority:
                          - 4
                          - 5
                        existing_data_points:
                          - phone
                          - work_email
                          - mobile_phone
                        locations:
