  /v3/lookalike/contacts:
    post:
      tags:
        - Lookalikes
      summary: Contact Lookalikes
      description: >
        Returns contact lookalikes based on seed contacts.


        *Endpoint*: **(POST) https://api.lusha.com/v3/lookalike/contacts**


          #### How It Works


        **First Request (Start a New Run):**

        - Do not send `dedupeSessionId`

        - Server generates one and returns it in the response

        - Use returned `dedupeSessionId` for subsequent "get more" requests


        **Subsequent Requests ("Get More"):**

        - Send the returned `dedupeSessionId` to fetch more results without
        duplicates

        - Server dedupes against all contacts previously returned for the
        `dedupeSessionId`

        - User-provided `exclude.*` is applied on every request and combined
        with server-side dedupe

        - Session history retained for 30 days from last activity (sliding
        window)

        ---
      operationId: getContactLookalikes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactLookalikesRequest'
            examples:
              firstRequest:
                summary: First request (server generates dedupeSessionId)
                value:
                  seeds:
                    linkedinUrls:
                      - https://www.linkedin.com/in/johndoe
                    emails:
                      - jane@acme.com
                      - bob@example.com
                    contacts:
                      - firstName: Alice
                        lastName: Smith
                        companyDomain: sap.com
                    contactIds:
                      - 1234
                      - 4567
                  exclude:
                    emails:
                      - existing@customer.com
                    linkedinUrls:
                      - https://www.linkedin.com/in/already-contacted/
                    contactIds:
                      - 9999
                  limit: 25
              secondRequestGetMore:
                summary: Second request (get more using dedupeSessionId)
                value:
                  dedupeSessionId: 58adaa77-7a6e-4c9b-8c2d-820a6538e613
                  seeds:
                    linkedinUrls:
                      - https://www.linkedin.com/in/johndoe
                    emails:
                      - jane@acme.com
                      - bob@example.com
                    contacts:
                      - firstName: Alice
                        lastName: Smith
                        companyDomain: sap.com
                    contactIds:
                      - 1234
                      - 4567
                  exclude:
                    emails:
                      - existing@customer.com
                    linkedinUrls:
                      - https://www.linkedin.com/in/already-contacted/
                    contactIds:
                      - 9999
                  limit: 25
      responses:
        '200':
          description: Successfully retrieved contact lookalikes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactLookalikesResponse'
              examples:
                firstResponse:
                  summary: Example response (first request)
                  value:
                    dedupeSessionId: 58adaa77-7a6e-4c9b-8c2d-820a6538e613
                    results:
                      - contactId: '9659196'
                        firstName: Sarah
                        lastName: Johnson
                        socialLinks:
                          linkedin: https://www.linkedin.com/in/sarahjohnson
                        company:
                          companyId: '8605368'
                          name: Marriott International
                          domain: marriott.com
                        jobTitle:
                          title: VP of Sales
                          departments:
                            - Sales
                          seniority: Director
                        location:
                          country: United States
                          state: Maryland
                          city: Bethesda
                    meta:
                      returned: 1
                      hasMore: true
                    creditsCharged: 3
                secondResponse:
                  summary: Example response (get more)
                  value:
                    dedupeSessionId: 58adaa77-7a6e-4c9b-8c2d-820a6538e613
                    results:
                      - contactId: '9659197'
                        firstName: Michael
                        lastName: Davis
                        socialLinks:
                          linkedin: https://www.linkedin.com/in/michaeldavis
                        company:
                          companyId: '8605369'
                          name: Hilton
                          domain: hilton.com
                        jobTitle:
                          title: Sales Director
                          departments:
                            - Sales
                          seniority: Director
                        location:
                          country: United States
                          state: Virginia
                          city: McLean
                    meta:
                      returned: 1
                      hasMore: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          description: Insufficient credits
