        total:
          type: integer
          example: 3
        successful:
          type: integer
          example: 2
        failed:
          type: integer
          example: 1
        results:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/CreateSubscriptionSuccessResult'
