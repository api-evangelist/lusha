          type: array
          items:
            type: string
            enum:
              - Business Development
              - Consulting
              - Customer Service
              - Engineering & Technical
              - Finance
              - General Management
              - Health Care & Medical
              - Human Resources
              - Information Technology
              - Legal
              - Marketing
              - Operations
              - Other
              - Product
              - Research & Analytics
              - Sales
