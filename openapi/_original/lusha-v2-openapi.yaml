    patch:
      tags:
        - Webhooks
      summary: Update Subscription
      description: >
        Updates an existing webhook subscription. All fields are optional.


        *Endpoint*: **(PATCH) https://api.lusha.com/api/subscriptions/{id}**


        ---

        **Reactivating Disabled Subscriptions:**


        When setting `isActive: true` on a previously disabled subscription, the
        system automatically:

        - Clears the `blockReason` field

        - Clears the `blockedAt` timestamp

        - Resets the retry counter


        **Regenerating Secrets:**


        Set `regenerateSecret: true` to generate a new webhook secret. The new
        secret:

        - Affects **all subscriptions** for your account

        - Is only shown once in the response

        - Immediately invalidates the old secret

        ---
      operationId: updateSubscription
      parameters:
        - name: id
          in: path
          required: true
          description: Subscription ID
          schema:
            type: string
          example: 507f1f77bcf86cd799439011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriptionRequest'
            examples:
              disableSubscription:
                summary: Disable a subscription
                value:
                  isActive: false
              updateSignals:
                summary: Change subscribed signals
                value:
                  signalTypes:
                    - promotion
                    - companyChange
              regenerateSecret:
                summary: Regenerate webhook secret
                value:
                  regenerateSecret: true
              updateUrl:
                summary: Update webhook URL
                value:
                  url: https://new-domain.com/webhooks/lusha
      responses:
        '200':
          description: Subscription updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/subscriptions/{id}/test:
    post:
      tags:
        - Webhooks
      summary: Test Subscription
      description: >
        Test a webhook subscription by sending a test signal. Supports three
        test modes.


        *Endpoint*: **(POST) https://api.lusha.com/api/subscriptions/{id}/test**

        ---

        **Test Modes:**

        - `direct` - Quick HTTP check only (validates URL responds correctly)

        - `kafka` - Fanout handler only (tests Kafka message processing)

        - `full` - Complete Kafka flow (default - end-to-end test)


        **What Gets Tested:**

        - URL accessibility and response time

        - Complete delivery pipeline (for full mode)

        - Signature generation and headers


        **Important Notes:**

        - Test deliveries do NOT consume credits

        - Test payloads use mock data

        - Useful for verifying webhook configuration before going live
      operationId: testSubscription
      parameters:
        - name: id
          in: path
          required: true
          description: Subscription ID
          schema:
            type: string
          example: 507f1f77bcf86cd799439011
        - name: mode
          in: query
          required: false
          description: Test mode
          schema:
            type: string
            enum:
              - direct
              - kafka
              - full
            default: full
          example: full
      responses:
        '200':
          description: Test executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestSubscriptionResponse'
              example:
                subscriptionId: 507f1f77bcf86cd799439011
                subscriptionName: My Test Webhook
                url: https://example.com/webhook
                mode: full
                flowCheck:
                  success: true
                  statusCode: 200
                  durationMs: 150
                testPayload:
                  entityType: contact
                  signalType: promotion
                  data: {}
                isSuccess: true
                timestamp: '2024-01-01T00:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Subscription does not belong to your account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 403
                message: Subscription does not belong to your account
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/subscriptions/delete:
    post:
      tags:
        - Webhooks
      summary: Delete Subscriptions
      description: >
        Delete one or more webhook subscriptions. Returns detailed results for
        each deletion with partial success support.


        *Endpoint*: **(POST) https://api.lusha.com/api/subscriptions/delete**


        ---


        **Behavior:**

        - Each subscription is processed independently

        - Returns detailed results for each item including deleted subscription
        info

        - Invalid ID formats are gracefully handled and reported as NOT_FOUND

        - Duplicate IDs are automatically deduplicated

        - Deletion is permanent and cannot be undone
      operationId: deleteSubscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 25
                  items:
                    type: string
                  description: Array of subscription IDs to delete
                  example:
                    - 507f1f77bcf86cd799439011
                    - 507f1f77bcf86cd799439012
            examples:
              singleDelete:
                summary: Delete a single subscription
                value:
                  ids:
                    - sub-123
              multipleDelete:
                summary: Delete multiple subscriptions
                value:
                  ids:
                    - sub-123
                    - sub-456
                    - sub-789
      responses:
        '200':
          description: Delete operation completed (full or partial success)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSubscriptionResponse'
              examples:
                allSuccessful:
                  summary: All subscriptions deleted successfully
                  value:
                    total: 3
                    successful: 3
                    failed: 0
                    results:
                      - index: 0
                        success: true
                        subscription:
                          id: sub-123
                          entityType: contact
                          entityId: '123'
                          name: Contact Webhook
                      - index: 1
                        success: true
                        subscription:
                          id: sub-456
                          entityType: company
                          entityId: '456'
                          name: Company Webhook
                      - index: 2
                        success: true
                        subscription:
                          id: sub-789
                          entityType: contact
                          entityId: '789'
                partialSuccess:
                  summary: Some deletions failed (partial success)
                  value:
                    total: 3
                    successful: 2
                    failed: 1
                    results:
                      - index: 0
                        success: true
                        subscription:
                          id: sub-123
                          entityType: contact
                          entityId: '123'
                          name: Contact Webhook
                      - index: 1
                        success: false
                        error:
                          code: NOT_FOUND
                          message: Subscription with id 'sub-456' not found
                      - index: 2
                        success: true
                        subscription:
                          id: sub-789
                          entityType: contact
                          entityId: '789'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/audit-logs:
    get:
      tags:
        - Webhooks
      summary: Get Audit Logs
      description: >
        Retrieve webhook delivery logs for your account.


        *Endpoint*: **(GET) https://api.lusha.com/api/audit-logs**


        **What's Logged:**

        - All webhook delivery attempts (success and failures)

        - HTTP status codes and response times

        - Error messages for failed deliveries

        - Delivery timestamps and duration metrics


        **Filtering:**

        - Filter by subscription ID to see logs for specific subscriptions

        - Filter by status to see only successes, failures, or permanent
        failures


        **Rate Limit:** 100 requests/minute per account


        > **Note:** Logs are retained for 90 days (successful) and 180 days
        (failed/DLQ)
      operationId: getAuditLogs
      parameters:
        - name: subscriptionId
          in: query
          required: false
          description: Filter by subscription ID
          schema:
            type: string
          example: 507f1f77bcf86cd799439011
        - name: status
          in: query
          required: false
          description: Filter by delivery status
          schema:
            type: string
            enum:
              - success
              - failed
              - permanent_failure
          example: success
        - name: limit
          in: query
          required: false
          description: Maximum number of results (1-100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          example: 50
        - name: offset
          in: query
          required: false
          description: Number of results to skip
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
      responses:
        '200':
          description: Audit logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogsResponse'
              example:
                data:
                  - id: log-123
                    subscriptionId: sub-123
                    payloadId: payload-456
                    status: success
                    statusCode: 200
                    url: https://example.com/webhook
                    deliveredAt: '2024-01-01T00:00:00.000Z'
                    durationMs: 150
                    error: null
                pagination:
                  total: 100
                  limit: 50
                  offset: 0
                  hasMore: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/audit-logs/stats:
    get:
      tags:
        - Webhooks
      summary: Get Audit Log Statistics
      description: |
        Get delivery statistics for your account.

        *Endpoint*: **(GET) https://api.lusha.com/api/audit-logs/stats**
      operationId: getAuditLogStats
      parameters:
        - name: subscriptionId
          in: query
          required: false
          description: Filter statistics by subscription ID
          schema:
            type: string
          example: sub-123
      responses:
        '200':
          description: Statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogStatsResponse'
              example:
                total: 1000
                success: 950
                failed: 50
                successRate: 95.00%
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/account/secret:
    get:
      tags:
        - Webhooks
      summary: Get Account Secret
      description: |
        Retrieve the current account webhook secret.

        *Endpoint*: **(GET) https://api.lusha.com/api/account/secret**
      operationId: getAccountSecret
      responses:
        '200':
          description: Account secret retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - secret
                properties:
                  secret:
                    type: string
                    description: Current account webhook secret
                    example: whsec_abc123def456ghi789jkl012mno345pqr678stu901vwx234yz
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Account secret not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 404
                message: Account secret not found. Please generate one first.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/account/secret/regenerate:
    post:
      tags:
        - Webhooks
      summary: Regenerate Account Secret
      description: >
        Regenerate the account webhook secret. Affects **all subscriptions** for
        the account.


        *Endpoint*: **(POST)
        https://api.lusha.com/api/account/secret/regenerate**


        **Behavior:**

        - If a secret already exists: Replaces with new secret (old secret is
        invalidated)

        - If no secret exists: Creates new secret automatically


        **Important Notes:**

        - The secret is only shown once in the response. Store it securely.

        - This endpoint always succeeds (upsert operation)

        - Regenerating invalidates the old secret for **all subscriptions** (if
        one existed)

        - An account secret must exist before webhooks can be delivered
      operationId: regenerateAccountSecret
      responses:
        '200':
          description: Account secret regenerated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - secret
                properties:
                  secret:
                    type: string
                    description: >-
                      Newly generated account webhook secret (store securely -
                      only shown once)
                    example: whsec_new_secret_here_abc123def456ghi789jkl012mno345
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: api_key
      description: >
        Your Lusha API key. You can find this in your Lusha dashboard under API
        settings.


        Include this key in the `api_key` header for all requests.
  parameters:
    firstName:
      name: firstName
      in: query
      description: The first name of the person
      schema:
        type: string
      example: Dustin
    lastName:
      name: lastName
      in: query
      description: The last name of the person
      schema:
        type: string
      example: Moskovitz
    personId:
      name: personId
      in: query
      description: The unique person identifier in Lusha
      schema:
        type: string
      example: '4183886134'
    companyName:
      name: companyName
      in: query
      description: The name of the company the person works at
      schema:
        type: string
      example: Lusha
    companyDomain:
      name: companyDomain
      in: query
      description: The domain name of the company
      schema:
        type: string
      example: lusha.com
    email:
      name: email
      in: query
      description: The email address of the person
      schema:
        type: string
      example: dustin@lusha.com
    linkedinUrl:
      name: linkedinUrl
      in: query
      description: The LinkedIn URL of the person
      schema:
        type: string
      example: https://www.linkedin.com/in/dustin/
    refreshJobInfo:
      name: refreshJobInfo
      in: query
      description: >
        Set to true to refresh and update the job details for the person.

        This ensures that outdated job information is replaced with the most
        recent data.
      schema:
        type: boolean
        default: false
      example: true
    filterBy:
      name: filterBy
      in: query
      description: >
        Filters results based on specific contact details. Available options:

        - `phoneNumbers`: Only return contacts with phone numbers

        - `emailAddresses`: Only return contacts with email addresses


        By default, results will include contacts with at least one contact
        detail.
      schema:
        type: string
        enum:
          - phoneNumbers
          - emailAddresses
    revealEmails:
      name: revealEmails
      in: query
      description: >
        Set `revealEmails=true` to retrieve only the email address of the
        contact.
      schema:
        type: boolean
        default: true
      example: true
    revealPhones:
      name: revealPhones
      in: query
      description: >
        Set `revealPhones=true` to retrieve only the phone number of the
        contact.
      schema:
        type: boolean
        default: true
      example: true
    signals:
      name: signals
      in: query
      description: |
        Array of signal types to retrieve for the contact.
        - `allSignals`: All available signal types
        - `promotion`: Promotion signals
        - `companyChange`: Company change signals
      schema:
        type: array
        items:
          type: string
          enum:
            - allSignals
            - promotion
            - companyChange
      example:
        - promotion
    signalsStartDate:
      name: signalsStartDate
      in: query
      description: >
        Start date for signal retrieval in YYYY-MM-DD format. Defaults to 6
        months ago if not specified.
      schema:
        type: string
        format: date
      example: '2025-03-01'
    partialProfile:
      name: partialProfile
      in: query
      description: >
        Search for a single contact with the option to receive a partial
        profile.
      required: false
      schema:
        type: boolean
        default: false
      example: true
  responses:
    BadRequest:
      description: Bad request - invalid input data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 400
            message: Invalid request parameters
    Unauthorized:
      description: Unauthorized - invalid or missing API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 401
            message: Invalid API key
    Forbidden:
      description: Forbidden - account inactive or feature not available
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            accountInactive:
              summary: Account inactive
              value:
                statusCode: 403
                message: >-
                  Your account is not active. Please reach out to support at
                  support@lusha.com
            featureNotAvailable:
              summary: Feature not available for pricing plan
              value:
                statusCode: 403
                message: >-
                  Your pricing version does not support requesting individual
                  datapoints [revealEmails, revealPhones]
            subscriptionLimitReached:
              summary: Subscription limit reached
              value:
                statusCode: 403
                message: Maximum subscriptions limit reached for your account
            dncNotSupported:
              summary: DNC filter not supported on current plan
              value:
                statusCode: 403
                message: >-
                  Exclude DNC is not supported on your current plan. Please
                  contact support or your account manager for assistance.
    NotFound:
      description: Not found - resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: Resource not found
    TooManyRequests:
      description: Too many requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 429
            message: Too many requests. Please wait before making another request.
      headers:
        RateLimit-Limit:
          description: The total number of allowed requests per second
          schema:
            type: integer
        RateLimit-Remaining:
          description: The number of remaining requests in the current window
          schema:
            type: integer
        RateLimit-Reset:
          description: The time (in seconds) until the rate limit quota is reset
          schema:
            type: integer
        X-RateLimit-Remaining-Daily:
          description: The number of remaining requests for your daily quota
          schema:
            type: integer
        X-RateLimit-Reset-Daily:
          description: The time when your daily quota will reset
          schema:
            type: integer
    GDPRRestricted:
      description: GDPR restricted - unable to process due to GDPR regulations
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 451
            message: >-
              We are unable to process this contact request due to our GDPR
              regulations
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 500
            message: Internal server error. Please try again later.
  schemas:
    ErrorResponse:
      type: object
      required:
        - statusCode
        - message
      properties:
        statusCode:
          type: integer
          description: HTTP status code
          example: 400
        message:
          type: string
          description: Error message
          example: Validation failed
        errors:
          type: array
          items:
            type: string
          description: Detailed error messages (optional, only for validation errors)
          example:
            - 'entityType must be one of: contact, company'
    Company:
      type: object
      properties:
        name:
          type: string
          description: The name of the company, Required if no domain.
          example: Lusha
        domain:
          type: string
          description: The domain of the company, Required if no name.
          example: lusha.com
        isCurrent:
          type: boolean
          description: Indicates whether this is the person's current company
          example: true
        jobTitle:
          type: string
          description: The job title of the person at the company
          example: Software Engineer
        fqdn:
          type: string
          description: The fully qualified domain name of the company
          example: https://lusha.com
        companySocialId:
          type: string
          description: The social ID associated with the company (if available)
          example: '1234567890'
      required:
        - isCurrent
    ContactSearchBulk:
      type: object
      properties:
        contactId:
          type: string
          description: >-
            A unique sequential ID to associate with the contact object in the
            API response
          example: '1234'
        personId:
          type: string
          description: The unique person identifier in Lusha
          example: '4183886134'
        fullName:
          type: string
          description: The full name of the person
          example: Dustin Moskovitz
        location:
          type: string
          description: The raw location of the person
          example: Singapore,Chicago
        linkedinUrl:
          type: string
          description: The LinkedIn URL of the person
          example: https://www.linkedin.com/in/dustin/
        email:
          type: string
          description: The email address of the person
          example: dustin@lusha.com
        companies:
          description: >-
            Details of the company where the contact is currently employed (or
            previously employed if applicable)
          type: array
          items:
            $ref: '#/components/schemas/Company'
      required:
        - contactId
    Metadata:
      type: object
      properties:
        refreshJobInfo:
          type: boolean
          description: >-
            Set this to true to refresh job information for the contact. This
            replaces any outdated job details with the most current information.
            By default, Lusha returns results for records that have at least one
            of the specified contact details (e.g., phone number or email
            address).
          example: true
        filterBy:
          type: string
          description: >-
            Filters the results based on specific contact details. Use the
            following options: emailAddresses, phoneNumbers
          example: emailAddresses
        revealEmails:
          type: boolean
          description: >
            Set `revealEmails=true` to retrieve only the email address of the
            contact.
          example: true
        revealPhones:
          type: boolean
          description: >
            Set `revealPhones=true` to retrieve only the phone number of the
            contact.
          example: true
        signals:
          type: array
          description: |
            Array of signal types to retrieve for the contact.
            - `allSignals`: All available signal types
            - `promotion`: Promotion signals
            - `companyChange`: Company change signals
          items:
            type: string
            enum:
              - allSignals
              - promotion
              - companyChange
          example:
            - promotion
            - companyChange
        signalsStartDate:
          type: string
          format: date
          description: >
            Start date for signal retrieval in YYYY-MM-DD format. Defaults to 6
            months ago if not specified.
          example: '2025-03-01'
        partialProfile:
          type: boolean
          description: >
            When set to true, returns a simplified contact profile with basic
            information only.
          default: false
          example: true
    SearchBulkContactsRequest:
      type: object
      properties:
        contacts:
          description: >-
            This is a required parameter that should contain a list of contact
            objects. Each contact will be processed based on the provided
            contact details.
          type: array
          items:
            $ref: '#/components/schemas/ContactSearchBulk'
        metadata:
          description: Metadata for the search to filter the results
          $ref: '#/components/schemas/Metadata'
      required:
        - contacts
    ContactError:
      type: object
      properties:
        code:
          type: number
          description: The code of the contact error
          example: 3
        name:
          type: string
          description: The name of the contact error
          example: EMPTY_DATA
        message:
          type: string
          description: The message of the contact error
          example: Could not find requested data
    EmailAddress:
      type: object
      properties:
        email:
          type: string
          description: The email address (alternative to 'address')
          example: dustin@lusha.com
        address:
          type: string
          description: The email address (alternative to 'email')
          example: dustin@lusha.com
        emailType:
          type: string
          description: The type of email address (alternative to 'type')
          example: work
          enum:
            - work
            - private
        emailConfidence:
          type: string
          description: The confidence level of the email address
          example: A+
        updateDate:
          type: string
          description: The update date of the email address
          example: '2020-01-01'
    PhoneNumbers:
      type: object
      properties:
        number:
          type: string
          description: The phone number
          example: '+1234567890'
        phoneType:
          type: string
          description: The type of phone number
          example: Mobile
          enum:
            - Mobile
            - Direct
            - Phone
        doNotCall:
          type: boolean
          description: Indicates whether the phone number is listed as "Do Not Call" (DNC).
          example: false
        updateDate:
          type: string
          description: The update date of the phone number
          example: '2020-01-01'
      required:
        - phoneType
        - doNotCall
        - updateDate
    LocationResponse:
      type: object
      properties:
        country:
          type: string
          description: The country where the person is located.
          example: Israel
        countryIso2:
          type: string
          description: The ISO 3166-1 alpha-2 country code of the person.
          example: IL
        country_iso2:
          type: string
          description: The ISO 3166-1 alpha-2 country code of the person.
          example: IL
        continent:
          type: string
          description: The continent where the person is located.
          example: Asia
        rawLocation:
          type: string
          example: 800 Boylston St, Suite 1410, Boston, MA 02199, US
          description: The detailed address.
        region:
          type: string
          description: The region where the person is located.
          example: Tel Aviv
        city:
          type: string
          description: The city where the person is located.
          example: Tel Aviv
        cityId:
          type: number
          description: The ID of the city where the person is located.
          example: 123
        state:
          type: string
          description: The state where the person is located.
          example: Tel Aviv
        stateCode:
          type: string
          description: The state code of the person.
          example: IL
        state_code:
          type: string
          description: The state code of the person.
          example: IL
        street:
          type: string
          description: The street where the person is located.
          example: 123 Main St
        locationCoordinates:
          description: The coordinates of the person.
          example:
            - 32.0853
            - 34.7818
