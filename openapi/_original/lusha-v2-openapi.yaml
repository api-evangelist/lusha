  /api/signals/filters/{objectType}:
    get:
      tags:
        - Signals
      summary: Get Signal Options
      description: >
        Retrieve available signal options for a specific entity type (contact or
        company).

        This endpoint returns the list of signal types you can filter by when
        enriching contacts or companies.


          **Endpoints:**

            * **Contacts:** `GET /api/signals/filters/contact`
            * **Companies:** `GET /api/signals/filters/company`


          #### Available Signal Types


            #### For contacts:

            * **`allSignals`** - All available contact signal types
            * **`promotion`** - Job title promotions
            * **`companyChange`** - Company changes

            ---

            #### For companies:

              * **`allSignals`** - All available company signal types

            <br />

            **Hiring & Workforce:**

            * **`surgeInHiring`** - Overall hiring activity increase
            * **`surgeInHiringByDepartment`** - Department-specific hiring surges
            * **`surgeInHiringByLocation`** - Location-specific hiring surges

            <br />

              **Headcount Trends:**

            | Signal | Description |
            |--------|-------------|
            | `headcountIncrease1m` / `headcountDecrease1m` | 1-month employee count changes |
            | `headcountIncrease3m` / `headcountDecrease3m` | 3-month employee count changes |
            | `headcountIncrease6m` / `headcountDecrease6m` | 6-month employee count changes |
            | `headcountIncrease12m` / `headcountDecrease12m` | 12-month employee count changes |

            <br />

              **Technology & Digital Presence:**

            * **`websiteTrafficIncrease`** - Website traffic growth
            * **`websiteTrafficDecrease`** - Website traffic decline
            * **`itSpendIncrease`** - IT spending increase
            * **`itSpendDecrease`** - IT spending decrease

            **News Events:**

            To retrieve company news, use one or more of the following category values:


            | Signal | Included Events |
            |--------|-----------------|
            | `commercialActivityNews` | Partnership, New Customer, New Vendor |
            | `corporateStrategyNews` | M&A, Facilities Expansion, New Location, Facility Closure, Asset Sale, Lawsuit Filed |
            | `financialEventsNews` | Funding Round, Asset Investment, Strategic Investment, IPO |
            | `marketIntelligenceNews` | Event Participation, Recognition, Competitor Activity |
            | `peopleNews` | Executive Hire, Executive Departure, Executive Promotion, Headcount Increase, Headcount Decrease |
            | `productActivityNews` | Product Launch, Product Development, Product Integration |
            | `riskNews` | Security Issue, Lawsuit Faced |


            > The response also includes available values for signal sub-filters:

              * `newsEventTypes` — available event type values for news signal filtering
              * `hiringByDepartments` — available department values for hiring surge filtering
              * `hiringByLocations` — available location values for hiring surge filtering (array of `{ country, state }` objects)
      operationId: getSignalOptions
      parameters:
        - name: objectType
          in: path
          required: true
          description: The type of object to get signal options for
          schema:
            type: string
            enum:
              - contact
              - company
          example: contact
      responses:
        '200':
          description: List of available signal types for the specified object type
          content:
            application/json:
              schema:
                type: object
                properties:
                  signals:
                    type: array
                    items:
                      type: string
                    example:
                      - promotion
                      - companyChange
                  objectType:
                    type: string
                    example: contact
                  filterOptions:
                    type: object
                    description: >-
                      Available enum values for signal sub-filters. Only present
                      in the `company` response.
                    properties:
                      newsEventTypes:
                        type: array
                        items:
                          type: string
                        description: Available values for the `newsEventTypes` filter
                      hiringByDepartments:
                        type: array
                        items:
                          type: string
                        description: Available values for the `hiringByDepartments` filter
              examples:
                contactSignals:
                  summary: Contact signal options
                  value:
                    signals:
                      - promotion
                      - companyChange
                      - allSignals
                    objectType: contact
                companySignals:
                  summary: Company signal options
                  value:
                    signals:
                      - allSignals
                      - websiteTrafficIncrease
                      - websiteTrafficDecrease
                      - itSpendIncrease
                      - itSpendDecrease
                      - headcountIncrease1m
                      - headcountDecrease1m
                      - headcountIncrease3m
                      - headcountDecrease3m
                      - headcountIncrease6m
                      - headcountDecrease6m
                      - headcountIncrease12m
                      - headcountDecrease12m
                      - surgeInHiring
                      - surgeInHiringByDepartment
                      - surgeInHiringByLocation
                      - riskNews
                      - commercialActivityNews
                      - corporateStrategyNews
                      - financialEventsNews
                      - peopleNews
                      - marketIntelligenceNews
                      - productActivityNews
                    objectType: company
                    filterOptions:
                      newsEventTypes:
                        - Asset Investment
                        - Asset Sale
                        - Competitor Activity
                        - Event Participation
                        - Executive Departure
                        - Executive Hire
                        - Executive Promotion
                        - Facilities Expansion
                        - Facility Closure
                        - Funding Round
                        - Headcount Decrease
                        - Headcount Increase
                        - IPO
                        - Lawsuit Faced
                        - Lawsuit Filed
                        - M&A
                        - New Customer
                        - New Location
                        - New Vendor
                        - Partnership
                        - Product Development
                        - Product Integration
                        - Product Launch
                        - Recognition
                        - Security Issue
                        - Strategic Investment
                      hiringByDepartments:
                        - Business Development
                        - Consulting
                        - Customer Service
                        - Engineering & Technical
                        - Finance
                        - General Management
                        - Health Care & Medical
                        - Human Resources
                        - Information Technology
                        - Legal
                        - Marketing
                        - Operations
                        - Other
                        - Product
                        - Research & Analytics
                        - Sales
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Signals API not supported on your plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
