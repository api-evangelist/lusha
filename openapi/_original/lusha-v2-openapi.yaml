  /v2/company:
    get:
      tags:
        - Enrichment
      summary: Search Single Company
      description: >
        Find detailed information about a single company by using different
        paramaters.

        >##### Endpoint:
          ```
        GET https://api.lusha.com/v2/company
          ```

        >##### Notes:
          - At least one of `domain`, `company`, or `companyId` is required.
          - Signal sub-filters (`newsEventTypes`, `hiringByDepartments`, `hiringByLocations`) are not supported on this endpoint. Use `POST /bulk/company/v2` with the `signalsFilters` parameter for filtered signal retrieval.
      operationId: searchSingleCompanyV2
      parameters:
        - name: domain
          in: query
          description: The domain name associated with the company
          schema:
            type: string
          example: example.com
        - name: company
          in: query
          description: The name of the company
          schema:
            type: string
          example: Lusha
        - name: companyId
          in: query
          description: |
            A unique identifier for a Lusha company.
          schema:
            type: string
          example: '1234567890'
        - name: signals
          in: query
          description: >
            Array of signal types to retrieve for the company.

            - `allSignals`: All available signal types


            > See the Signal Options endpoint for complete list of available
            signals and their categories
          schema:
            type: array
            items:
              type: string
              enum:
                - allSignals
                - websiteTrafficIncrease
                - websiteTrafficDecrease
                - itSpendIncrease
                - itSpendDecrease
                - headcountIncrease1m
                - headcountDecrease1m
                - headcountIncrease3m
                - headcountDecrease3m
                - headcountIncrease6m
                - headcountDecrease6m
                - headcountIncrease12m
                - headcountDecrease12m
                - surgeInHiring
                - surgeInHiringByDepartment
                - surgeInHiringByLocation
                - riskNews
                - commercialActivityNews
                - corporateStrategyNews
                - financialEventsNews
                - peopleNews
                - marketIntelligenceNews
                - productActivityNews
            example:
              - itSpendIncrease
        - name: signalsStartDate
          in: query
          description: >
            Start date for signal retrieval in YYYY-MM-DD format. Defaults to 6
            months ago if not specified.
          schema:
            type: string
            format: date
            example: '2025-03-01'
        - name: partialCompany
          in: query
          description: |
            Expand coverage with partial company profiles
          schema:
            type: boolean
            default: true
            example: false
      responses:
        '200':
          description: Company information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanySingleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
