    ---


    Lusha provides a RESTful API that allows you to query a comprehensive

    dataset of business profiles and company information.


    It is designed for teams building prospecting, enrichment, automation, and
    analytics workflows that require accurate, continuously updated business
    data. The API supports both real-time and bulk use cases and is suitable for
    production environments.


    Use the Lusha API to search for new prospects, enrich existing records,
    react to real-world changes, and expand coverage using lookalike
    recommendations.


    *All API requests should be made over HTTPS (SSL), and the response bodies
    are delivered in JSON format.*


