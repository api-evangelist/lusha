          properties:
            value:
              type: number
              example: 500000
            currency:
              type: string
              example: USD
            valueUsd:
              type: number
              example: 500000
        monthlyWebsiteTraffic:
          type: object
          description: >-
            Revealed via reveal: ["monthlyWebsiteTraffic"] in Enrich Companies.
            Charged 1 credit when non-null.
          nullable: true
          properties:
