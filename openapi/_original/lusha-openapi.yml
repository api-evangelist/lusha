  /v3/companies/signal-score:
    post:
      tags:
        - Signals
      summary: Score Companies by Signal Activity
      operationId: getCompanySignalScores
      description: >
        Score companies by their active buying signals. Returns the aggregate
        Signal Score - a `[0, 1]` value reflecting the fraction of the company's
        active signals - plus the active signal breakdown.


        Accepts up to 100 companies, each identified by exactly one of `id`,
        `domain`, `name`, or `email`. All identifiers are resolved to Lusha
        company IDs server-side before scoring.


        Each result is one of:

        - A **scored entry** - `signalScore`, `signalTypes`, and
        `noActiveSignals`.

        - A **`NOT_FOUND`** entry - the company service could not resolve the
        supplied identifier.

        - A **`NO_SCORE`** entry - the company resolved, but the scoring engine
        returned nothing for it.


        > **Billing:** 1 credit is charged per scored row via
        `signal_score_company_reveal`. This action is currently
        limited-availability - while it isn't yet seeded on an account's
        pricebook, the endpoint stays free (`billing.creditsCharged` is `0`).
        Error rows (`NOT_FOUND` / `NO_SCORE`) are never charged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V3SignalScoreCompaniesRequest'
            example:
              companies:
                - clientReferenceId: ref-1
                  id: v1.AbCdEfGhIjKlMnOpQrStUvWxYz012345
                - clientReferenceId: ref-2
                  domain: www.microsoft.com
                - clientReferenceId: ref-3
                  name: Apple
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V3SignalScoreCompaniesResponse'
              example:
                requestId: 5d6f13d2-f6b0-4e55-85d5-04e17f932c1a
                results:
                  - clientReferenceId: ref-1
                    id: v1.AbCdEfGhIjKlMnOpQrStUvWxYz012345
                    name: Acme Corp
                    domain: www.acmecorp.io
                    signalScore: 0.42
                    signalTypes:
                      - hiringSignalIncrease
                      - websiteVisit
                    noActiveSignals: false
                  - clientReferenceId: ref-2
                    id: v1.6789ZyXwVuTsRqPoNmLkJiHgFeDcBa01
                    name: Microsoft
                    domain: www.microsoft.com
                    signalScore: 0
                    signalTypes: []
                    noActiveSignals: true
                  - clientReferenceId: ref-3
                    domain: nope-xyz.com
                    error:
                      code: NOT_FOUND
                      message: Company not found
                billing:
                  creditsCharged: 2
                  resultsReturned: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v3/contacts/signal-score:
    post:
      tags:
        - Signals
      summary: Score Contacts by Signal Activity
      operationId: getContactSignalScores
      description: >
        Score contacts by their active buying signals. Returns the aggregate
        Signal Score - a `[0, 1]` value - plus the active signal breakdown per
        contact.


        Accepts up to 100 contacts. Each contact is resolved to a Lusha person
        ID and company ID server-side (identity only - no PII is revealed)
        before scoring. Provide one of:

        - `id` (encrypted Lusha contact ID)

        - `linkedinUrl`

        - `email`

        - `firstName` + `lastName` + (`companyName` or `companyDomain`)


        Each result is one of:

        - A **scored entry** - `signalScore`, `signalTypes`, and
        `noActiveSignals`.

        - A **`NOT_FOUND`** entry - identity resolution failed for the supplied
        identifier.

        - A **`NO_SCORE`** entry - the contact resolved, but the scoring engine
        returned nothing for it.


        > **Note:** A full outage of the identity-resolution provider is never
        masked as `NOT_FOUND` - it returns a retryable `502` instead, so callers
        can retry rather than treating the batch as authoritatively unresolved.


        > **Billing:** 1 credit is charged per scored row via
        `signal_score_contact_reveal`. This action is currently
        limited-availability - while it isn't yet seeded on an account's
        pricebook, the endpoint stays free (`billing.creditsCharged` is `0`).
        Error rows (`NOT_FOUND` / `NO_SCORE`) are never charged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V3SignalScoreContactsRequest'
            example:
              contacts:
                - clientReferenceId: ref-1
                  id: v1.AbCdEfGhIjKlMnOpQrStUvWxYz012345
                - clientReferenceId: ref-2
                  linkedinUrl: https://linkedin.com/in/johndoe
                - clientReferenceId: ref-3
