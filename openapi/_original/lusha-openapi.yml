        results:
          type: array
          items:
            $ref: '#/components/schemas/V3ContactPreview'
        billing:
          $ref: '#/components/schemas/V3Billing'
    V3ContactsEnrichRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 100
          example:
            - '4389064654'
            - '4389064624'
        reveal:
          type: array
          items:
            type: string
            enum:
              - emails
              - phones
          example:
            - emails
            - phones
        waterfallEnabled:
          type: boolean
          default: true
          description: >
            Whether this call is allowed to fall through to your enabled

            third-party providers when Lusha's own data has no match, for the
            fields

            requested via `reveal`. Defaults to `true` whenever Data Waterfall
            is

            enabled on your account (Account > Waterfall) - pass `false` to opt
            this

            specific call out. Has no effect if Data Waterfall or no providers
            are

            enabled on your account. Provider order isn't configurable - Lusha
            manages

            that internally.
          example: false
        tableId:
          type: string
          description: >-
            Optional. If provided, these contacts are also added to this table
            (if not already present) and the revealed fields' columns are
            populated. See the Tables API.
          example: '482910'
    V3ContactsEnrichResponse:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        results:
          type: array
          items:
