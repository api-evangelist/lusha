            facebook:
              type: string
              nullable: true
              description: >
                Company Facebook page URL. Included automatically when available
                - no `reveal` entry needed. Omitted from the response when not
                available (never returned empty). Free field - no credits
                charged. Available on all plans.
              example: https://www.facebook.com/lusha
            x:
              type: string
              nullable: true
              description: >
                Company X (formerly Twitter) profile URL. Included automatically
                when available - no `reveal` entry needed. Omitted from the
                response when not available (never returned empty). Free field -
                no credits charged. Available on all plans.
              example: https://x.com/lusha
