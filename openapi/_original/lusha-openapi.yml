          type: array
          items:
            type: string
          example:
            - react
            - node.js
            - aws
        popularityTier:
          type: number
          example: 1
        logoUrl:
          type: string
          example: https://logo.lusha.co/logo.jpg
        employeesByDepartment:
          type: array
          description: >
            Breakdown of employees by department. Revealed via `reveal:
            ["employeesByDepartment"]` in Enrich Companies.
          items:
            type: object
            properties:
              department:
                type: string
                description: Department name
                example: Engineering & Technical
              count:
                type: integer
                description: Number of employees in this department
                example: 14
          example:
            - department: Engineering & Technical
              count: 14
            - department: Operations
              count: 40
            - department: Other
              count: 104
        employeesByLocation:
          type: array
          description: >
            Breakdown of employees by country and state. Revealed via `reveal:
            ["employeesByLocation"]` in Enrich Companies.
          items:
            type: object
            properties:
              country:
                type: string
                description: Country name
                example: United States
              state:
                type: string
                nullable: true
                description: State or region (null when not available)
                example: Colorado
              count:
                type: integer
                description: Number of employees in this location
                example: 54
          example:
            - country: United States
              state: Colorado
              count: 54
            - country: United States
              state: Texas
              count: 44
            - country: United States
              state: null
              count: 162
        employeesBySeniority:
          type: array
          description: >
            Breakdown of employees by seniority level. Revealed via `reveal:
            ["employeesBySeniority"]` in Enrich Companies.
          items:
            type: object
            properties:
              seniority:
                type: string
                description: Seniority level
                example: Manager
              count:
                type: integer
                description: Number of employees at this seniority level
                example: 39
          example:
            - seniority: Non-Manager
              count: 122
            - seniority: Manager
              count: 39
            - seniority: Vice President
              count: 3
        competitors:
          type: array
          description: >
            List of competitor companies. Revealed via `reveal: ["competitors"]`
            in Enrich Companies. Use Enrich Companies with the returned IDs to
            get full firmographic data on each competitor.
          items:
            type: object
            properties:
              id:
                type: string
