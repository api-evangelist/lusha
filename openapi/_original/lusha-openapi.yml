    CreateSubscriptionRequest:
      type: object
      required:
        - defaults
        - subscriptions
      properties:
        defaults:
          type: object
          required:
            - url
          properties:
            url:
              type: string
              format: uri
              maxLength: 2048
              description: Webhook URL (HTTPS required in production)
              example: https://example.com/webhooks/lusha
            entityType:
              type: string
              enum:
                - contact
                - company
              description: Default entity type for all subscriptions
              example: contact
            signalTypes:
              type: array
              items:
                type: string
              description: Default signal types for all subscriptions
              example:
                - promotion
        name:
          type: string
          maxLength: 100
          description: Default subscription name prefix
          example: Contact Webhook
        subscriptions:
          type: array
          minItems: 1
          maxItems: 25
          description: Array of subscriptions to create (max 25)
          items:
            type: object
            required:
              - entityId
            properties:
              entityId:
                type: string
                maxLength: 255
                description: Entity ID (always required per item)
                example: '123'
              entityType:
                type: string
                enum:
                  - contact
                  - company
                description: Overrides default entityType
              signalTypes:
                type: array
                items:
                  type: string
                description: Overrides default signalTypes
              name:
                type: string
                maxLength: 100
                description: Overrides default name
    CreateSubscriptionResponse:
      type: object
      required:
        - total
        - successful
        - failed
        - results
      properties:
        total:
          type: integer
          example: 3
        successful:
          type: integer
          example: 2
        failed:
          type: integer
          example: 1
        results:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/CreateSubscriptionSuccessResult'
              - $ref: '#/components/schemas/CreateSubscriptionErrorResult'
    CreateSubscriptionSuccessResult:
      type: object
      required:
        - index
        - success
        - subscription
      properties:
        index:
          type: integer
          example: 0
        success:
          type: boolean
          enum:
            - true
          example: true
        subscription:
          $ref: '#/components/schemas/SubscriptionWithoutSecret'
    CreateSubscriptionErrorResult:
      type: object
      required:
        - index
        - success
        - error
      properties:
        index:
          type: integer
          example: 1
        success:
          type: boolean
          enum:
            - false
          example: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - DUPLICATE_SUBSCRIPTION
                - URL_VALIDATION_FAILED
                - WEBHOOK_VERIFICATION_FAILED
                - FORBIDDEN
                - UNKNOWN_ERROR
              example: DUPLICATE_SUBSCRIPTION
            message:
              type: string
              example: >-
                Subscription already exists for entity type 'contact' with
                entity ID '456'
    DeleteSubscriptionResponse:
      type: object
      required:
        - total
        - successful
        - failed
        - results
      properties:
        total:
          type: integer
          example: 3
        successful:
          type: integer
          example: 2
        failed:
          type: integer
          example: 1
        results:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/DeleteSubscriptionSuccessResult'
              - $ref: '#/components/schemas/DeleteSubscriptionErrorResult'
    DeleteSubscriptionSuccessResult:
      type: object
      required:
        - index
        - success
        - subscription
      properties:
        index:
          type: integer
          example: 0
        success:
          type: boolean
          enum:
            - true
          example: true
        subscription:
          type: object
          properties:
            id:
              type: string
              example: sub-123
            entityType:
              type: string
              example: contact
            entityId:
              type: string
              example: '123'
            name:
              type: string
              example: Contact Webhook
    DeleteSubscriptionErrorResult:
      type: object
      required:
        - index
        - success
        - error
      properties:
        index:
          type: integer
          example: 1
        success:
          type: boolean
          enum:
            - false
          example: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - NOT_FOUND
                - VALIDATION_ERROR
                - FORBIDDEN
                - UNKNOWN_ERROR
              example: NOT_FOUND
            message:
              type: string
              example: Subscription with id 'sub-456' not found
