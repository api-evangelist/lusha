          application/json:
            schema:
              $ref: '#/components/schemas/V3ContactsEnrichRequest'
            examples:
              standard:
                summary: >-
                  Standard reveal (waterfall runs automatically if enabled on
                  your account)
                value:
                  ids:
                    - '4389064654'
                    - '4389064624'
                  reveal:
