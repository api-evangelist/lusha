  /v3/contacts/lookalike:
    post:
      tags:
        - Lookalikes
      summary: Contact Lookalikes
      operationId: getContactLookalikes
      description: >
        Find contacts similar to a set of seed contacts using AI-powered
        recommendations.


        Provide 5-100 seed contacts via LinkedIn URLs, emails, Lusha IDs, or
        name + company. The API returns contacts who share similar roles,
        seniority, and company profiles.


        **Pagination without duplicates:**

        On your first request, omit `dedupeSessionId` — the server generates one
        and returns it. Pass it on every subsequent request to get more results
        without repeating contacts already seen. Sessions are retained for 30
        days.


        Use the `exclude` field to always filter out specific contacts (e.g.
        existing customers).


        Results are lightweight previews. Use Enrich Contacts with the returned
        `id` to get emails and phones.


        > **Billing:** Charged per result via the `lookalikeContact` action.


        > **Persisting to a table:** Pass `tableId` to also persist matching
        results into an existing table. See [Contacts
        Tables](#tag/Contacts-Tables).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactLookalikesRequest'
            examples:
              firstRequest:
                summary: First request (server generates dedupeSessionId)
                value:
                  seeds:
                    linkedinUrls:
                      - https://www.linkedin.com/in/orit-shilvock-6243bb5
                    emails:
                      - gal.ashkelon@lusha.com
                    ids:
                      - '1234'
                  exclude:
                    emails:
                      - existing@customer.com
                  limit: 25
              secondRequest:
                summary: Second request (get more using dedupeSessionId)
                value:
                  dedupeSessionId: 58adaa77-7a6e-4c9b-8c2d-820a6538e613
                  seeds:
                    linkedinUrls:
                      - https://www.linkedin.com/in/shmulikwillinger
                  limit: 25
      responses:
        '200':
          description: Successfully retrieved contact lookalikes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactLookalikesResponse'
              example:
                dedupeSessionId: 58adaa77-7a6e-4c9b-8c2d-820a6538e613
                results:
                  - id: '9659196'
                    firstName: Sarah
                    lastName: Johnson
                meta:
                  returned: 1
                  hasMore: true
                billing:
                  creditsCharged: 3
                  resultsReturned: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          description: Insufficient credits
        '403':
          $ref: '#/components/responses/Forbidden'
        '410':
          description: dedupeSessionId is invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DedupeSessionInvalidError'
        '500':
          $ref: '#/components/responses/InternalServerError'
