            $ref: '#/components/schemas/V3SearchAndEnrichContactResult'
        billing:
          $ref: '#/components/schemas/V3Billing'
    V3CompaniesSearchRequest:
      type: object
      required:
        - companies
      properties:
        companies:
          type: array
          items:
            $ref: '#/components/schemas/V3CompanySearchItem'
          minItems: 1
          maxItems: 100
        options:
          $ref: '#/components/schemas/V3SearchOptions'
        signals:
          $ref: '#/components/schemas/V3CompanySignalsDto'
    V3CompaniesSearchResponse:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        results:
          type: array
          items:
            $ref: '#/components/schemas/V3CompanyPreview'
        billing:
          $ref: '#/components/schemas/V3Billing'
    V3CompaniesEnrichRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 100
          description: Company IDs from search results (strings)
          example:
            - '16303253'
            - '12790225'
        reveal:
          type: array
          items:
            type: string
            enum:
              - employeesByDepartment
              - employeesByLocation
              - employeesBySeniority
              - competitors
              - intent
              - estimatedAnnualItSpend
              - monthlyWebsiteTraffic
          description: >
            Additional data fields to reveal. Each field is charged separately
            per result.

            - `employeesByDepartment` — breakdown of employees by department

            - `employeesByLocation` — breakdown of employees by country/state

            - `employeesBySeniority` — breakdown of employees by seniority level

            - `competitors` — list of competitor company IDs

            - `intent` — buyer intent topics

            - `estimatedAnnualItSpend` — estimated annual IT spend. 1 credit per
            company, charged only when a non-null value is returned.

            - `monthlyWebsiteTraffic` — monthly website traffic and
            month-over-month change. 1 credit per company, charged only when a
            non-null value is returned.
          example:
            - employeesByDepartment
            - employeesByLocation
            - employeesBySeniority
            - competitors
            - intent
            - estimatedAnnualItSpend
            - monthlyWebsiteTraffic
        tableId:
          type: string
          description: >-
            Optional. If provided, these companies are also added to this table
            (if not already present) and the revealed fields' columns are
            populated. See the Tables API.
          example: '583021'
    V3CompaniesEnrichResponse:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        results:
          type: array
          items:
            $ref: '#/components/schemas/V3EnrichedCompany'
        tableWrite:
          $ref: '#/components/schemas/TableWrite'
        billing:
          $ref: '#/components/schemas/V3Billing'
    V3CompaniesSearchAndEnrichRequest:
      type: object
