        keywords:
          type: array
          description: Filter by keywords associated with the company.
          items:
            type: string
          example:
            - cloud
            - artificial intelligence
        specialities:
          type: array
          items:
            type: string
        exactSpecialities:
          type: array
          items:
            type: string
        exactKeywords:
          type: array
          items:
            type: string
        keywordsSearchFields:
          type: array
          items:
            type: string
        previousCompanyDomains:
          type: array
          items:
