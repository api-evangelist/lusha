    CreateOptOutSubscriptionRequest:
      type: object
      required:
        - entityType
        - url
      description: Request body for creating an opt-out webhook subscription
      properties:
        entityType:
          type: string
          enum:
            - contact
          description: >-
            Entity type for opt-out subscriptions. Currently only `contact` is
            supported.
          example: contact
        url:
          type: string
          format: uri
          maxLength: 2048
          description: Your webhook endpoint URL (HTTPS required in production)
          example: https://example.com/webhook
        name:
          type: string
          maxLength: 100
          description: Descriptive name for this subscription
          example: Account opt-out webhook
    OptOutDatapoint:
      type: object
      description: >-
        A single contact data point that must be removed following an opt-out
        request
      required:
        - datapointId
        - datapointType
      properties:
        datapointId:
          type: string
          description: The actual value of the data point (phone number or email address)
          example: '+14155550199'
        datapointType:
          type: string
          enum:
            - phone
            - email
          description: Type of data point
          example: phone
    OptOutWebhookPayload:
      type: object
      description: >
        Payload delivered to your opt-out webhook URL when a contact requests
        data removal.


        Your system must process this payload to remove the listed data points
        from any internal records, CRM entries, or outreach sequences.
      required:
        - contactId
        - fullName
        - contactOptOutDate
        - contactExposureDate
        - datapoints
      properties:
        contactId:
          type: string
          description: Lusha contact ID of the person who opted out
          example: '987654321'
        fullName:
          type: string
          description: Full name of the contact
          example: Jane Doe
        companyName:
          type: string
          description: Company the contact is associated with
          example: Acme Corp
        jobTitle:
          type: string
          description: Job title of the contact
          example: Director of Product
        linkedinUrl:
          type: string
          description: LinkedIn profile URL of the contact
          example: https://www.linkedin.com/in/jane-doe
        contactOptOutDate:
          type: string
          description: Timestamp when the contact submitted their opt-out request (UTC)
          example: '2026-04-22 14:32:11.412'
        contactExposureDate:
          type: string
          description: >-
            Timestamp when this contact's data was first exposed to your account
            (UTC)
          example: '2025-08-03 09:15:47'
        datapoints:
          type: array
          description: >-
            List of specific data points (emails and/or phones) that must be
            removed
          items:
            $ref: '#/components/schemas/OptOutDatapoint'
          example:
            - datapointId: '+14155550199'
              datapointType: phone
            - datapointId: jane.doe@acme.com
              datapointType: email
        partnerClientId:
          type: string
          nullable: true
          description: >
            Your internal client/tenant identifier, if provided when the contact
            data was originally revealed. Useful for multi-tenant setups to
            route the removal to the correct system.
          example: acme-crm-tenant-42
    TestSubscriptionResponse:
      type: object
      required:
        - subscriptionId
        - url
        - mode
        - isSuccess
        - timestamp
      properties:
        subscriptionId:
          type: string
          example: 507f1f77bcf86cd799439011
        subscriptionName:
          type: string
          example: My Test Webhook
        url:
          type: string
          format: uri
          example: https://example.com/webhook
        mode:
          type: string
          enum:
