            is optional; combine any subset.
          properties:
            isIpo:
              type: boolean
            ranges:
              type: array
              items:
                type: object
                properties:
                  coverage:
                    type: string
                    enum:
                      - last_funding
                      - any_round
                      - total_funds
                      - last_round
                  min:
                    type: integer
                  max:
                    type: integer
            date:
              type: object
              properties:
                coverage:
                  type: string
                  enum:
                    - last_funding
                    - any_round
                    - total_funds
                    - last_round
                date:
                  type: string
                  format: date
            rounds:
              type: array
              items:
                type: object
                properties:
                  coverage:
                    type: string
                    enum:
                      - last_funding
                      - any_round
                      - total_funds
                      - last_round
                  round:
                    type: string
                    enum:
                      - pre_seed
                      - seed
                      - series_a
                      - series_b
                      - series_c
                      - series_d
                      - series_e
                      - series_f
                      - series_g
                      - series_h
                      - other
            names:
              type: array
              items:
                type: object
                properties:
                  coverage:
                    type: string
                    enum:
                      - last_funding
                      - any_round
                      - total_funds
                      - last_round
                  name:
                    type: string
                    enum:
                      - angel
                      - venture
                      - private_equity
                      - crowdfunding
                      - grant
                      - debt_financing
                      - other
            investors:
              type: array
              items:
                type: string
              description: Free text. Accepted but not currently applied downstream.
            types:
              type: array
              items:
                type: string
              description: Legacy free text. Accepted but not currently applied downstream.
        foundedYear:
          type: array
          description: >-
            Filter by year the company was founded. Supports `min` (greater than
            or equal) and `max` (less than or equal) range operators.
          items:
            type: object
            properties:
              min:
                type: integer
                example: 2000
              max:
                type: integer
                example: 2020
        businessModel:
          type: array
          description: 'Filter by business model. Accepted values: B2B, B2C, B2G.'
          items:
            type: string
            enum:
              - B2B
              - B2C
              - B2G
          example:
            - B2B
        companyType:
          type: array
          description: >-
            Filter by company type. Accepted values: Government, Private
            Company, Public Company, Educational, Non Profit, Self Employed.
          items:
            type: string
            enum:
              - Government
              - Private Company
              - Public Company
              - Educational
              - Non Profit
              - Self Employed
          example:
            - Public Company
        linkedinUrls:
          type: array
          description: Filter by company LinkedIn URLs.
          items:
            type: string
          example:
            - https://www.linkedin.com/company/google
        keywords:
          type: array
          description: Filter by keywords associated with the company.
          items:
            type: string
          example:
            - fintech
        specialities:
          type: array
          items:
            type: string
        exactSpecialities:
          type: array
          items:
            type: string
        exactKeywords:
          type: array
          items:
            type: string
        keywordsSearchFields:
          type: array
          items:
            type: string
        previousCompanyDomains:
          type: array
          items:
            type: string
        previousCompanyNames:
          type: array
          items:
            type: string
        geographicDetails:
          type: array
          items:
            type: object
            properties:
              country:
                type: string
              zipcode:
                type: string
              distance:
                type: integer
                description: Radius in miles.
        locationsZipcodes:
          type: array
          items:
            type: object
            properties:
              countryIso2:
                type: string
              zipcode:
                type: string
        headquarterZipcodes:
          type: array
          items:
            type: object
            properties:
              countryIso2:
                type: string
              zipcode:
                type: string
    V3CompanyProspectingFilters:
      type: object
      properties:
        names:
          type: array
          items:
            type: string
        domains:
          type: array
          items:
            type: string
        ids:
          type: array
