  /api/subscriptions/delete:
    post:
      tags:
        - Webhooks
      summary: Delete Subscriptions
      description: >
        Delete one or more webhook subscriptions. Returns detailed results for
        each deletion with partial success support.


        *Endpoint*: **(POST) https://api.lusha.com/api/subscriptions/delete**


        ---


        **Behavior:**

        - Each subscription is processed independently

        - Returns detailed results for each item including deleted subscription
        info

        - Invalid ID formats are gracefully handled and reported as NOT_FOUND

        - Duplicate IDs are automatically deduplicated

        - Deletion is permanent and cannot be undone
      operationId: deleteSubscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 25
                  items:
                    type: string
                  description: Array of subscription IDs to delete
                  example:
                    - 507f1f77bcf86cd799439011
                    - 507f1f77bcf86cd799439012
            examples:
              singleDelete:
                summary: Delete a single subscription
                value:
                  ids:
                    - sub-123
              multipleDelete:
                summary: Delete multiple subscriptions
                value:
                  ids:
                    - sub-123
                    - sub-456
                    - sub-789
      responses:
        '200':
          description: Delete operation completed (full or partial success)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSubscriptionResponse'
              examples:
                allSuccessful:
                  summary: All subscriptions deleted successfully
                  value:
                    total: 3
                    successful: 3
                    failed: 0
                    results:
                      - index: 0
                        success: true
                        subscription:
                          id: sub-123
                          entityType: contact
                          entityId: '123'
                          name: Contact Webhook
                partialSuccess:
                  summary: Some deletions failed
                  value:
                    total: 3
                    successful: 2
                    failed: 1
                    results:
                      - index: 0
                        success: true
                        subscription:
                          id: sub-123
                          entityType: contact
                          entityId: '123'
                          name: Contact Webhook
                      - index: 1
                        success: false
                        error:
                          code: NOT_FOUND
                          message: Subscription with id 'sub-456' not found
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/audit-logs:
    get:
      tags:
        - Webhooks
      summary: Get Audit Logs
      description: >
        Retrieve webhook delivery logs for your account.


        *Endpoint*: **(GET) https://api.lusha.com/api/audit-logs**


        **What's Logged:**

        - All webhook delivery attempts (success and failures)

        - HTTP status codes and response times

        - Error messages for failed deliveries

        - Delivery timestamps and duration metrics


        **Filtering:**

        - Filter by subscription ID to see logs for specific subscriptions

        - Filter by status to see only successes, failures, or permanent
        failures


        **Rate Limit:** 100 requests/minute per account


        > **Note:** Logs are retained for 90 days (successful) and 180 days
        (failed/DLQ)
      operationId: getAuditLogs
      parameters:
        - name: subscriptionId
          in: query
          required: false
          description: Filter by subscription ID
          schema:
            type: string
          example: 507f1f77bcf86cd799439011
        - name: status
          in: query
          required: false
          description: Filter by delivery status
          schema:
            type: string
            enum:
              - success
              - failed
              - permanent_failure
          example: success
        - name: limit
          in: query
          required: false
          description: Maximum number of results (1-100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          example: 50
        - name: offset
          in: query
          required: false
          description: Number of results to skip
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
      responses:
        '200':
          description: Audit logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogsResponse'
              example:
                data:
                  - id: log-123
                    subscriptionId: sub-123
                    payloadId: payload-456
                    status: success
                    statusCode: 200
                    url: https://example.com/webhook
                    deliveredAt: '2024-01-01T00:00:00.000Z'
                    durationMs: 150
                    error: null
                pagination:
                  total: 100
                  limit: 50
                  offset: 0
                  hasMore: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/audit-logs/stats:
    get:
      tags:
        - Webhooks
      summary: Get Audit Log Statistics
      description: |
        Get delivery statistics for your account.

        *Endpoint*: **(GET) https://api.lusha.com/api/audit-logs/stats**
      operationId: getAuditLogStats
      parameters:
        - name: subscriptionId
          in: query
          required: false
          description: Filter statistics by subscription ID
          schema:
            type: string
          example: sub-123
      responses:
        '200':
          description: Statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogStatsResponse'
              example:
                total: 1000
                success: 950
                failed: 50
                successRate: 95.00%
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/account/secret:
    get:
      tags:
        - Webhooks
      summary: Get Account Secret
      description: |
        Retrieve the current account webhook secret.

        *Endpoint*: **(GET) https://api.lusha.com/api/account/secret**
      operationId: getAccountSecret
      responses:
        '200':
          description: Account secret retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - secret
                properties:
                  secret:
                    type: string
                    description: Current account webhook secret
                    example: whsec_abc123def456ghi789jkl012mno345pqr678stu901vwx234yz
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Account secret not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 404
                message: Account secret not found. Please generate one first.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/account/secret/regenerate:
    post:
      tags:
        - Webhooks
      summary: Regenerate Account Secret
      description: >
        Regenerate the account webhook secret. Affects **all subscriptions** for
        the account.


        *Endpoint*: **(POST)
        https://api.lusha.com/api/account/secret/regenerate**


        **Behavior:**

        - If a secret already exists: Replaces with new secret (old secret is
        invalidated)

        - If no secret exists: Creates new secret automatically


        **Important Notes:**

        - The secret is only shown once in the response. Store it securely.

        - This endpoint always succeeds (upsert operation)

        - Regenerating invalidates the old secret for **all subscriptions** (if
        one existed)

        - An account secret must exist before webhooks can be delivered
      operationId: regenerateAccountSecret
      responses:
        '200':
          description: Account secret regenerated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - secret
                properties:
                  secret:
                    type: string
                    description: >-
                      Newly generated account webhook secret (store securely -
                      only shown once)
                    example: whsec_new_secret_here_abc123def456ghi789jkl012mno345
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/subscriptions/opt-out:
    post:
      tags:
        - Webhooks
      summary: Create Opt-Out Subscription
      description: >
        Subscribe to real-time notifications when a contact opts out of data
        processing. When a contact requests removal, Lusha sends an
        `OptOutWebhookPayload` to your endpoint so you can action the removal in
        your own systems (CRM, outreach tools, etc.).


        *Endpoint*: **(POST) https://api.lusha.com/api/subscriptions/opt-out**


        ---


        **How it works:**

        - Create one opt-out subscription per account (scoped to `contact`
        entity type)

        - Lusha delivers a POST request to your URL whenever a contact opts out

        - The payload includes the contact identity, opt-out date, and the
        specific data points (emails and/or phones) that must be removed


        **Payload you'll receive:**

        ```json

        {
          "contactId": "987654321",
          "fullName": "Jane Doe",
          "companyName": "Acme Corp",
          "jobTitle": "Director of Product",
          "linkedinUrl": "https://www.linkedin.com/in/jane-doe",
          "contactOptOutDate": "2026-04-22 14:32:11.412",
          "contactExposureDate": "2025-08-03 09:15:47",
          "datapoints": [
            { "datapointId": "+14155550199", "datapointType": "phone" },
            { "datapointId": "jane.doe@acme.com", "datapointType": "email" }
          ],
          "partnerClientId": "acme-crm-tenant-42"
        }

        ```


        > **Important:** Signature verification applies the same way as standard
        webhook deliveries. See [Security & Verification](#tag/Webhooks) for
        details.


        > **Note:** Ensure your account has a webhook secret before creating
        this subscription. See [Regenerate Account
        Secret](#operation/regenerateAccountSecret).
      operationId: createOptOutSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOptOutSubscriptionRequest'
            example:
              entityType: contact
              url: https://example.com/webhook
              name: Account opt-out webhook
      responses:
        '201':
          description: Opt-out subscription created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptOutSubscriptionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Forbidden - feature not available or opt-out subscription already
            exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 403
                message: An opt-out subscription already exists for this account
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v3/account/usage:
    get:
      tags:
        - Account
      summary: Get Account Usage
      operationId: getAccountUsage
      description: >
        Returns a full snapshot of your account status:

        - **Credits** — total, used, and remaining for the current billing cycle

        - **Rate limits** — current usage and reset times for daily, hourly, and
        per-minute windows

        - **Plan** — your current plan category and renewal dates

        - **Pricing** — credit cost per action type across all public API
        endpoints


        > **Rate limit:** This endpoint is limited to 5 requests per minute.
      responses:
        '200':
          description: Successfully retrieved account usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountUsageResponse'
              example:
                credits:
                  total: 10000
                  used: 1500
                  remaining: 8500
                rateLimits:
                  daily:
                    limit: 5000
                    used: 120
                    remaining: 4880
                    resetsAt: '2026-03-31T00:00:00.000Z'
                plan:
                  category: professional
                  renewalType: annual
                  startDate: '2026-01-01T00:00:00.000Z'
                  endDate: '2027-01-01T00:00:00.000Z'
                pricing:
                  revealEmail:
                    credits: 1
                    perQuantity: 1
                  revealPhone:
                    credits: 5
                    perQuantity: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: api_key
      description: >
        Your Lusha API key. You can find this in your Lusha dashboard under API
        settings.

        Include this key in the `api_key` header for all requests.
  parameters:
    TableIdPath:
      name: table_id
      in: path
      required: true
      description: The table's ID.
      schema:
        type: string
      example: '482910'
    ColumnIdPath:
      name: column_id
      in: path
      required: true
      description: The column's ID.
      schema:
        type: string
      example: col_signals_funding
    OwnerEmailQuery:
      name: email
      in: query
      required: false
      description: >-
        Email of the user making the request. Used to scope ownership/visibility
        checks on GET/DELETE calls, which cannot carry a body.
      schema:
        type: string
        format: email
      example: user@example.com
  responses:
    BadRequest:
      description: Bad request - invalid input data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 400
            message: Invalid request parameters
    Unauthorized:
      description: Unauthorized - invalid or missing API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 401
            message: Invalid API key
    PaymentRequired:
      description: Payment required - insufficient credits
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 402
            message: Insufficient credits for this operation
    Forbidden:
      description: >-
        Forbidden - account inactive, V3 access not enabled, or plan does not
        include this feature
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            accountInactive:
              summary: Account inactive
              value:
                statusCode: 403
                message: >-
                  Your account is not active. Please reach out to support at
                  support@lusha.com
            v3NotEnabled:
              summary: V3 access not enabled
              value:
                statusCode: 403
                message: V3 API access is not enabled for your account
    BadGateway:
      description: >-
        Bad gateway - upstream identity resolution provider is unavailable.
        Retryable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 502
            message: >-
              Identity resolution provider is temporarily unavailable. Retry
              with backoff.
    NotFound:
      description: Not found - resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: Resource not found
    TableNotFound:
      description: Not found - table does not exist or is not accessible to this account
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: 'TABLE_NOT_FOUND: Table not found'
    ColumnNotFound:
      description: Not found - column does not exist on the given table
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: 'COLUMN_NOT_FOUND: Column not found'
    TableNameConflict:
      description: Conflict - a table with this name already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 409
            message: 'TABLE_NAME_CONFLICT: A table with this name already exists'
    TooManyRequests:
      description: Too many requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 429
            message: Too many requests. Please wait before making another request.
      headers:
        x-rate-limit-daily:
          description: Total requests allowed per day
          schema:
            type: integer
        x-daily-requests-left:
          description: Requests remaining in daily quota
          schema:
            type: integer
        x-rate-limit-hourly:
          description: Total requests allowed per hour
          schema:
            type: integer
        x-hourly-requests-left:
          description: Requests remaining in hourly quota
          schema:
            type: integer
        x-rate-limit-minute:
          description: Total requests allowed per minute
          schema:
            type: integer
        x-minute-requests-left:
          description: Requests remaining in current minute window
          schema:
            type: integer
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 500
            message: Internal server error. Please try again later.
  schemas:
    ErrorResponse:
      type: object
      required:
        - statusCode
        - message
      properties:
        statusCode:
          type: integer
          description: HTTP status code
          example: 400
        message:
          type: string
          description: Error message
          example: Validation failed
        errors:
          type: array
          items:
            type: string
          description: Detailed error messages (optional, only for validation errors)
          example:
            - 'entityType must be one of: contact, company'
    DedupeSessionInvalidError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: DEDUPE_SESSION_INVALID
        message:
          type: string
          example: >-
            The provided dedupeSessionId is invalid or expired. Generate a new
            request without dedupeSessionId to start a fresh run.
    V3Billing:
      type: object
      description: Credit usage summary for a V3 API request
      properties:
        creditsCharged:
          type: integer
          description: Total credits charged for this request
          example: 3
        resultsReturned:
          type: integer
          description: Number of successful results returned
          example: 1
    V3SearchOptions:
      type: object
      description: Additional options for search requests
      properties:
        includePartialProfiles:
          type: boolean
          description: Include partial profiles in results
          example: true
    V3CanRevealItem:
      type: object
      description: Indicates a data type that can be revealed and its credit cost
      properties:
        field:
          type: string
          enum:
            - emails
            - phones
          example: emails
        credits:
          type: integer
          description: Credit cost (0 when already revealed for this account)
          example: 1
    V3ItemError:
      type: object
      description: Per-item error in a batch response
      properties:
        code:
          type: string
          enum:
            - NOT_FOUND
            - COMPLIANCE_RESTRICTED
            - ENRICH_FAILED
            - NO_SCORE
          example: NOT_FOUND
        message:
          type: string
          example: Contact not found
    V3Location:
      type: object
      description: Location filter object used in prospecting requests
      properties:
        city:
          type: string
          example: San Francisco
        state:
          type: string
          example: California
        country:
          type: string
          example: United States
        continent:
          type: string
          example: North America
        countryGrouping:
          type: string
          example: EMEA
        region:
          type: string
          example: California
        countryIso2:
          type: string
          example: US
    V3Range:
      type: object
      description: Numeric range filter
      properties:
        min:
          type: integer
          minimum: 0
          example: 1
        max:
          type: integer
          example: 1000
    V3PaginationRequest:
      type: object
      required:
        - page
        - size
      properties:
        page:
          type: integer
          minimum: 0
          maximum: 1000
          default: 0
          example: 0
        size:
          type: integer
          minimum: 10
          maximum: 100
          default: 25
          example: 25
    V3PaginationResponse:
      type: object
      properties:
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 25
        total:
          type: integer
    TableOwner:
      type: object
      description: >
        Identifies the user acting on the table, and resolves to a user on your
        account. Required on every table-route call when authenticating with an
        API key (there is no signed-in user) — omitting it returns `400`.
        Optional for OAuth/token callers, since the caller is already identified
        by the token; still accepted if you want to act on behalf of another
        owner.
      properties:
        email:
          type: string
          format: email
          description: >-
            Must resolve to an existing user on the account tied to your API
            key.
          example: user@example.com
    CellStatus:
      type: string
      enum:
        - not_run
        - processing
        - success
        - no_data
        - failed
      description: >
        Current state of a single cell's data. `no_data` means the run succeeded
        but found nothing — distinct from `failed`, which means the run itself
        errored.
    RunScope:
      type: string
      enum:
        - all
        - missing
        - specific
      description: >
        Controls which rows a column operation applies to. `all` re-runs every
        row, including already-processed ones. `missing` only runs rows that
        don't have a value for this column yet. `specific` requires `entityIds`.
    TableWrite:
      type: object
      description: >
        Added to a Prospecting, Enrich, Signals, or Lookalike response when
        `tableId` is passed on the request. The primary response is unaffected
        even if the table write fails.
      properties:
        tableId:
          type: string
          example: '482910'
        added:
          type: integer
          description: Number of new entities added to the table by this call.
          example: 3
        alreadyPresent:
          type: integer
          description: Number of entities from this call that were already in the table.
          example: 2
        columnsCreated:
          type: integer
          description: >-
            Number of columns auto-created by this call (e.g. a Signals column
            created on first use).
          example: 0
        rowsProcessed:
          type: integer
          description: Number of rows the column-run touched as part of this call.
          example: 5
        rowsCharged:
          type: integer
          description: Number of those rows that incurred a credit charge.
          example: 5
        rowsAlreadyPaidInTable:
          type: integer
          description: >-
            Number of those rows that were already paid for in this table and
            were not re-charged.
          example: 0
        creditsCharged:
          type: integer
          description: Credits charged specifically for this table write.
          example: 0
    CreatedBy:
      type: object
      description: Where and by whom the table was created.
      properties:
        surface:
          type: string
          enum:
            - api
            - mcp
            - workspace
          example: api
        createdByUserId:
          type: integer
          example: 12345
    AddedBy:
      type: object
      description: Where and by whom a row was added to the table.
      properties:
        surface:
          type: string
          enum:
            - api
            - mcp
            - workspace
          example: api
    TableMetadata:
      type: object
      description: TableDto — static metadata for a table.
      properties:
        tableId:
          type: string
          example: '482910'
        name:
          type: string
          example: VP Sales US Tech Q2
        entityType:
          type: string
          enum:
            - contacts
            - companies
          example: contacts
        visibility:
          type: string
          enum:
            - private
            - shared
          example: private
        status:
          type: string
          enum:
            - active
            - archived
            - deleted
          description: >
            Lifecycle state. `active` and `archived` are filterable via the List
            Tables `status` field; `deleted` is not a filterable status.
          example: active
        owner:
          $ref: '#/components/schemas/OwnerInfo'
        createdBy:
          $ref: '#/components/schemas/CreatedBy'
        workspaceUrl:
          type: string
          example: https://workspace.lusha.com/tables/482910
    OwnerInfo:
      type: object
      description: >
        Resolved owner of the table. `id` is always present; `email` and `name`
        are resolved best-effort within the API key's account and may be omitted
        if resolution fails (in which case the object contains only `id`).
        Replaces the removed top-level `ownerId` field - this is a breaking
        change from the prior response shape.
      properties:
        id:
          type: integer
          example: 12345
        email:
          type: string
          format: email
          example: owner@lusha.com
        name:
          type: string
          example: Ada Lovelace
    TableStatusData:
      type: object
      description: >-
        Response payload for Get Table — TableDto fields plus live entity/column
        counts.
      allOf:
        - $ref: '#/components/schemas/TableMetadata'
        - type: object
          properties:
            entityCount:
              type: integer
              example: 5
            isProcessing:
              type: boolean
              description: Whether any column run is currently in progress on this table.
              example: false
            columns:
              type: array
              items:
                $ref: '#/components/schemas/ColumnSummary'
    TableResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/TableStatusData'
        billing:
          $ref: '#/components/schemas/V3Billing'
    TableCreateRequest:
      type: object
      required:
        - name
        - owner
      properties:
        name:
          type: string
          example: postman-companies
        visibility:
          type: string
          enum:
            - private
            - shared
          default: private
        owner:
          $ref: '#/components/schemas/TableOwner'
        ids:
          type: array
          description: Optional initial entity IDs to seed the table with.
          items:
            type: string
          example:
            - '10042851'
            - '10042852'
    TableUpdateRequest:
      type: object
      required:
        - owner
      description: >
        `name`, `visibility`, and `archived` are all optional — send any subset;
        omitted fields stay unchanged. Sending none of them is a no-op. A
        partial update re-reads the persisted table first, so fields you don't
        send are never clobbered.
      properties:
        name:
          type: string
          example: renamed
        visibility:
          type: string
          enum:
            - private
            - shared
          example: shared
        archived:
          type: boolean
          description: >-
            Set `true` to archive the table (hides it from default List Tables
            results), `false` to restore it.
          example: true
        owner:
          $ref: '#/components/schemas/TableOwner'
    TableListRequest:
      type: object
      required:
        - owner
      properties:
        owner:
          $ref: '#/components/schemas/TableOwner'
        page:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
        size:
          type: integer
          default: 100
        name:
          type: string
          description: Optional filter — matches tables whose name contains this text.
          example: Q3
        status:
          type: string
          enum:
            - active
            - archived
          description: '`deleted` is not a filterable status.'
    TableListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TableMetadata'
        pagination:
          $ref: '#/components/schemas/V3PaginationResponse'
        billing:
          $ref: '#/components/schemas/V3Billing'
    EntitiesAddRequest:
      type: object
      required:
        - entityIds
        - owner
      properties:
        entityIds:
          type: array
          items:
            type: string
          maxItems: 500
          description: >
            Lusha IDs as strings — `personId` for contacts, `lushaCompanyId` for
            companies. Accepts either the encrypted token (`v{N}.…`, as returned
            by Search/Enrich/Get Entities) or the legacy numeric ID. An ID that
            is neither a valid token nor numeric returns `400`.
          example:
            - '10042854'
            - '10042855'
            - '10042856'
        companyIds:
          type: array
          items:
            type: string
          description: >
            Contacts tables only. One `lushaCompanyId` per contact (encrypted
            token or numeric), index-aligned with `entityIds`, to help pair
            company-level enrichment to the right company for each contact.
            Ignored on companies tables.
          example:
            - '16303253'
            - '16303253'
            - '12790225'
        owner:
          $ref: '#/components/schemas/TableOwner'
    EntitiesAddResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            added:
              type: integer
              example: 20
            alreadyPresent:
              type: integer
              example: 5
            invalidIds:
              type: array
              description: >-
                IDs that couldn't be resolved. Not an error — the call still
                returns `200`.
              items:
                type: string
              example: []
            addedBy:
              $ref: '#/components/schemas/AddedBy'
        billing:
          $ref: '#/components/schemas/V3Billing'
    EntitiesRemoveRequest:
      type: object
      required:
        - entityIds
        - owner
      properties:
        entityIds:
          type: array
          items:
            type: string
          description: >
            Accepts either the encrypted token (`v{N}.…`, as returned by Get
            Entities) or the legacy numeric ID. Unresolved IDs are echoed back
            in `invalidIds` in the exact form you sent them.
          example:
            - '10042851'
            - '10042852'
        owner:
          $ref: '#/components/schemas/TableOwner'
    EntitiesRemoveResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            removed:
              type: integer
              example: 10
            invalidIds:
              type: array
              items:
                type: string
              example: []
        billing:
          $ref: '#/components/schemas/V3Billing'
    EntityColumnValue:
      type: object
      description: >
        One column's value on a single row, as returned by Get Entities. This
        shape is a passthrough from the underlying Workspace service — the
        fields shown here (`id`, `name`, `type`, `sourceType`, `value`,
        `status`) are representative, not an exhaustive schema.
      properties:
        id:
          type: string
          example: f8c1a2b3
        name:
          type: string
          example: company_name
        type:
          type: string
          example: string
        sourceType:
          type: string
          example: lusha
        value:
          nullable: true
          description: The cell's data. Shape depends on the column type.
          example: Google
        status:
          $ref: '#/components/schemas/CellStatus'
    TableEntity:
      type: object
      description: >
        A single row. `id` is the **encrypted** Lusha ID (`v{N}.…`) — `personId`
        for contacts, `lushaCompanyId` for companies — in the same format used
        across V3, so it round-trips directly into Add Entities, Remove
        Entities, and Enrich. Internal fields (`accountId`, `companyLid`,
        `lushaCompanyId`, `personId`, `companyDetails`) are not returned.
        Remaining per-row fields under `columns` are owned by the Workspace
        service; this shape is representative, not an exhaustive schema.
      properties:
        id:
          type: string
          description: Encrypted Lusha ID.
          example: v1.aB3kZ9example
        columns:
          type: array
          items:
            $ref: '#/components/schemas/EntityColumnValue'
    EntitiesGetResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TableEntity'
        pagination:
          $ref: '#/components/schemas/V3PaginationResponse'
        billing:
          $ref: '#/components/schemas/V3Billing'
    ColumnSummary:
      type: object
      description: >-
        ColumnDto — a column's definition plus aggregated per-cell status
        counts.
      properties:
        columnId:
          type: string
          example: c1
        name:
          type: string
          example: Job title
        type:
          type: string
          enum:
            - lusha
            - crm
            - signal
            - ai
            - score
          example: lusha
        key:
          type: string
          nullable: true
          example: jobTitle
        isDefault:
          type: boolean
          description: Default Lusha columns cannot be removed.
          example: false
        addedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        rowsNotRun:
          type: integer
        rowsProcessing:
          type: integer
        rowsSuccess:
          type: integer
        rowsNoData:
          type: integer
        rowsFailed:
          type: integer
    ColumnsListResponse:
      type: object
      description: Response for List Columns — `data` is a bare array of ColumnDto.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ColumnSummary'
        billing:
          $ref: '#/components/schemas/V3Billing'
    ColumnsAddRequest:
      type: object
      required:
        - name
        - type
        - owner
      properties:
        name:
          type: string
          example: Job title
        type:
          type: string
          enum:
            - lusha
            - crm
            - signal
            - ai
            - score
          example: lusha
        key:
          type: string
          description: >-
            Optional, type-specific key identifying which underlying
            field/signal/etc. this column pulls.
          example: jobTitle
        meta:
          type: object
          description: Optional, type-specific configuration for the column.
          example: {}
        runScope:
          $ref: '#/components/schemas/RunScope'
        entityIds:
          type: array
          items:
            type: string
          description: Required only when `runScope` is `specific`.
        owner:
          $ref: '#/components/schemas/TableOwner'
    ColumnsAddResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            columnId:
              type: string
              example: c1
            name:
              type: string
              example: Job title
            type:
              type: string
              example: lusha
            runStatus:
              type: string
              nullable: true
              description: Present only if `runScope` triggered a run on add.
              example: processing
        billing:
          $ref: '#/components/schemas/V3Billing'
    ColumnsRunRequest:
      type: object
      required:
        - runScope
        - owner
      properties:
        runScope:
          $ref: '#/components/schemas/RunScope'
        entityIds:
          type: array
          items:
            type: string
          description: Required when `runScope` is `specific`.
        owner:
          $ref: '#/components/schemas/TableOwner'
    ColumnsRunResponse:
      type: object
      description: >
