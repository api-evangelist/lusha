      summary: Run Column on Contacts Table
      operationId: runContactsTableColumn
      description: >
        Populate or refresh a column's data for some or all rows in the table.
        This is **asynchronous** — the call returns immediately with `status:
        "processing"`; poll Get Contacts Table for `isProcessing` and per-column
        row-status counts to know when it's done, then read the values via Get
        Contacts Table Entities.


        **`runScope` values:**

        - `all` — every row, including already-processed ones (re-runs /
        refreshes). Most expensive.

        - `missing` — only rows that have never been run for this column.
        Cheapest, safe to call repeatedly.

        - `specific` — only the `entityIds` you pass. Also how you implement
        "run for this page" — fetch the page via Get Contacts Table Entities,
        then pass those IDs here.


        > **Billing:** Charged per row processed, per the column's credit tier.
        Re-running with `all` charges again for rows that already have data.
      parameters:
        - $ref: '#/components/parameters/TableIdPath'
        - $ref: '#/components/parameters/ColumnIdPath'
      requestBody:
        required: true
        content:
          application/json:
