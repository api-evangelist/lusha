        (companyName | companyDomain).
      properties:
        clientReferenceId:
          type: string
          maxLength: 256
          example: ref-1
        id:
          type: string
          description: Encrypted Lusha contact ID (vN.…).
          example: v1.AbCdEfGhIjKlMnOpQrStUvWxYz012345
        linkedinUrl:
          type: string
          example: https://linkedin.com/in/johndoe
        email:
          type: string
          format: email
          example: jane.doe@acme.com
        firstName:
          type: string
          example: Jane
        lastName:
          type: string
          example: Doe
        companyName:
          type: string
          example: Acme Corp
        companyDomain:
          type: string
          example: acme.com
