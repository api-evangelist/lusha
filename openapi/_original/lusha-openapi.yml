    V3ContactSignalsRequest:
      type: object
      required:
        - ids
        - signalTypes
      properties:
        ids:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 100
          example:
            - '4389064624'
            - '4389064654'
        signalTypes:
          type: array
          items:
            type: string
            enum:
              - allSignals
              - promotion
              - companyChange
          example:
            - allSignals
        startDate:
          type: string
          format: date
          example: '2025-01-01'
        maxResultsPerSignal:
          type: integer
          minimum: 1
          maximum: 100
          example: 10
        tableId:
          type: string
          description: >-
            Optional. If provided, these contacts are also added to this table
            (if not already present) and the Signals column is populated. See
            the Tables API.
          example: '482910'
    V3ContactSignalsResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: '4389064624'
              companyChange:
                type: array
                items:
                  type: object
              promotion:
                type: array
                items:
                  type: object
        startDate:
          type: string
        endDate:
          type: string
        tableWrite:
          $ref: '#/components/schemas/TableWrite'
        billing:
          $ref: '#/components/schemas/V3Billing'
    V3CompanySignalsRequest:
      type: object
      required:
        - ids
        - signalTypes
      properties:
        ids:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 100
          example:
            - '16303253'
        signalTypes:
          type: array
          items:
            type: string
            enum:
              - allSignals
              - linkedinActivityIntent
              - websiteTrafficDecrease
              - websiteTrafficIncrease
              - itSpendIncrease
              - itSpendDecrease
              - surgeInHiring
              - headcountIncrease1m
              - headcountIncrease3m
              - headcountIncrease6m
              - headcountIncrease12m
              - headcountDecrease1m
              - headcountDecrease3m
              - headcountDecrease6m
              - headcountDecrease12m
              - surgeInHiringByDepartment
              - surgeInHiringByLocation
              - riskNews
              - commercialActivityNews
              - corporateStrategyNews
              - financialEventsNews
              - peopleNews
              - marketIntelligenceNews
              - productActivityNews
          example:
            - allSignals
        startDate:
          type: string
          format: date
          description: >
            For linkedinActivityIntent, results are limited to a trailing 90-day
            window regardless of the value passed (legal requirement). Other
            signal types are unaffected.
          example: '2025-01-01'
        maxResultsPerSignal:
          type: integer
          minimum: 1
          maximum: 100
          description: >
            For linkedinActivityIntent, results are capped at 50 per company
            regardless of the value passed. Other signal types use the requested
            value as-is (1-100).
          example: 10
        tableId:
          type: string
          description: >-
            Optional. If provided, these companies are also added to this table
            (if not already present) and the Signals column is populated. See
            the Tables API.
          example: '583021'
        filters:
          type: object
          properties:
            include:
              type: object
              properties:
                intentCategories:
                  type: array
                  items:
                    type: string
                  description: >
                    Refines linkedinActivityIntent results by Bombora intent
                    category. Only applies when linkedinActivityIntent is
                    requested (via signalTypes or allSignals). See GET
                    /v3/companies/signals/filters/intentCategories for valid
                    values.
                  example:
                    - Technology
                    - Business
    LinkedinActivityIntentTopic:
      type: object
      properties:
        topic:
          type: string
          example: Cloud Security
        category:
          type: string
          example: Technology
    LinkedinActivityIntentPerson:
      type: object
      description: >-
        A person referenced in a LinkedIn activity intent post (author or
        mention).
      properties:
        id:
          type: string
          nullable: true
          description: >-
            Lusha contact ID, or null if the person couldn't be resolved to a
            Lusha record.
          example: '4389064624'
        fullName:
          type: string
          example: Daniel Turgeman
        linkedinUrl:
          type: string
          example: https://www.linkedin.com/in/daniel-turgeman-49676b161
    LinkedinActivityIntentCompanyMention:
      type: object
      description: A company referenced in a LinkedIn activity intent post.
      properties:
        id:
          type: string
          nullable: true
          description: >-
            Lusha company ID, or null if the company couldn't be resolved to a
            Lusha record.
          example: '16303253'
        name:
          type: string
          example: Lusha
        linkedinUrl:
          type: string
          example: https://www.linkedin.com/company/lushadata
    LinkedinActivityIntentItem:
      type: object
      properties:
        companyId:
          type: number
          description: Lusha company ID this activity belongs to.
          example: 16303253
        activityPublicationDate:
          type: string
          format: date
          description: Date the post was published.
          example: '2026-05-12'
        signalCategory:
          type: string
          description: Post classification.
          example: Technology or Stack Discussion
        intentTopics:
          type: array
          description: Detected Bombora topics and their category.
          items:
            $ref: '#/components/schemas/LinkedinActivityIntentTopic'
        author:
          $ref: '#/components/schemas/LinkedinActivityIntentPerson'
        contactsMentioned:
          type: array
          items:
            $ref: '#/components/schemas/LinkedinActivityIntentPerson'
        companiesMentioned:
          type: array
          items:
            $ref: '#/components/schemas/LinkedinActivityIntentCompanyMention'
        activityUrl:
          type: string
          description: URL of the source post.
          example: https://www.linkedin.com/feed/update/urn:li:activity:1234567890
        activitySummary:
          type: string
          nullable: true
          description: AI-generated summary. Never contains the raw post text.
          example: Discusses adopting a new cloud security stack ahead of Q3 rollout.
        activityLikes:
          type: integer
          default: 0
          example: 42
        activityComments:
          type: integer
          default: 0
          example: 5
        activityShares:
          type: integer
          default: 0
          example: 3
        activityType:
          type: string
          example: post
    V3CompanySignalsResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: '16303253'
              companyName:
                type: string
                example: Lusha
              domain:
                type: string
                example: lusha.com
              linkedinActivityIntent:
                type: array
                items:
                  $ref: '#/components/schemas/LinkedinActivityIntentItem'
            additionalProperties:
              type: array
              items:
                type: object
                additionalProperties: true
        startDate:
          type: string
        endDate:
          type: string
        tableWrite:
          $ref: '#/components/schemas/TableWrite'
        billing:
          $ref: '#/components/schemas/V3Billing'
    ContactSignalTypesResponse:
      type: object
      properties:
        signalTypes:
          type: array
          items:
            type: string
          example:
            - allSignals
            - promotion
            - companyChange
    CompanySignalTypesResponse:
      type: object
      properties:
        signalTypes:
          type: array
          items:
            type: string
    V3SignalScoreCompanyItem:
      type: object
      description: Must contain exactly one of id, domain, name, or email.
      properties:
        clientReferenceId:
          type: string
          maxLength: 256
          description: Caller-supplied token echoed back on the matching result.
          example: ref-1
        id:
          type: string
          description: >-
            Encrypted Lusha company ID (vN.…). Legacy numeric IDs accepted
            during the transition window.
          example: v1.AbCdEfGhIjKlMnOpQrStUvWxYz012345
        domain:
          type: string
          example: www.microsoft.com
        name:
          type: string
          example: Apple
        email:
          type: string
          format: email
          description: >-
            Must be a valid email address; only the domain part is used for
            resolution. A malformed email is rejected with 400.
          example: jane@acme.com
    V3SignalScoreCompaniesRequest:
      type: object
      required:
        - companies
      properties:
        companies:
          type: array
          items:
            $ref: '#/components/schemas/V3SignalScoreCompanyItem'
          minItems: 1
          maxItems: 100
    V3SignalScoreCompanyResult:
      type: object
      description: >-
        A scored entry, or an error entry with NOT_FOUND / NO_SCORE instead of
        the score fields.
      properties:
        clientReferenceId:
          type: string
          example: ref-1
        id:
          type: string
          description: >-
            Encrypted Lusha company ID for scored entries. On NOT_FOUND, echoes
            the supplied domain/name (or the derived domain, for an email
            request).
          example: v1.AbCdEfGhIjKlMnOpQrStUvWxYz012345
        name:
          type: string
          example: Acme Corp
        domain:
          type: string
          example: www.acmecorp.io
        signalScore:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            Aggregate signal score - the fraction of the company's active
            signals. Absent on error entries.
          example: 0.42
        signalTypes:
          type: array
          description: >-
            Signal types currently active for this company (canonical
            camelCase). Absent on error entries.
          items:
            type: string
          example:
            - hiringSignalIncrease
            - websiteVisit
        noActiveSignals:
          type: boolean
          description: >-
            True when the company resolved and scored but has no active signals
            (signalScore is 0). Absent on error entries.
          example: false
        error:
          $ref: '#/components/schemas/V3ItemError'
    V3SignalScoreCompaniesResponse:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
          example: 5d6f13d2-f6b0-4e55-85d5-04e17f932c1a
        results:
          type: array
          items:
            $ref: '#/components/schemas/V3SignalScoreCompanyResult'
        billing:
          $ref: '#/components/schemas/V3Billing'
    V3SignalScoreContactItem:
      type: object
      description: >
