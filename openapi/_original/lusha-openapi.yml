          type: array
          items:
            $ref: '#/components/schemas/V3ContactPreview'
        pagination:
          $ref: '#/components/schemas/V3PaginationResponse'
        tableWrite:
          $ref: '#/components/schemas/TableWrite'
        billing:
          $ref: '#/components/schemas/V3Billing'
    V3ProspectingCompaniesRequest:
      type: object
      required:
        - pagination
        - filters
      properties:
        pagination:
          $ref: '#/components/schemas/V3PaginationRequest'
        filters:
          type: object
          required:
            - companies
          description: >
            `filters.contacts` cannot be combined with company `searchText`,
            `signals`, `intent`, or `technologies` on the same request — doing
            so returns `400` (contact filters are never silently ignored).
          properties:
            companies:
              type: object
              required:
                - include
              properties:
                include:
                  $ref: '#/components/schemas/V3CompanyProspectingFilters'
                exclude:
                  $ref: '#/components/schemas/V3CompanyProspectingFilters'
            contacts:
              type: object
              properties:
                include:
                  $ref: '#/components/schemas/V3ContactsOnCompanySearchFilters'
                exclude:
                  $ref: '#/components/schemas/V3ContactsOnCompanySearchFilters'
        tableId:
          type: string
          description: >-
            Optional. If provided, results are also persisted to this table. See
            the Tables API.
          example: '583021'
        options:
          type: object
          properties:
            includePartialProfiles:
              type: boolean
              default: false
    V3ProspectingCompaniesResponse:
