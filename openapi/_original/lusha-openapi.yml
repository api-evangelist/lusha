  /v3/contacts/buying-group:
    post:
      tags:
        - Buying Group
      summary: Get Buying Group Contacts
      operationId: getContactsBuyingGroup
      description: >
        Identify the buying group within a set of target companies. Supply
        companies by `domain` or Lusha company `id` - the model scores and
        labels each returned contact with a persona role.


        **Personas:**

        - `decision_maker` — has budget or sign-off authority

        - `potential_champion` — likely internal advocate for the purchase

        - `end_user` — likely day-to-day user of the product


        Pass `personas` to filter to specific roles, or omit it to get all
        three. Use `contactsLimit` to cap how many contacts are returned per
        company (default 60).


        Results are lightweight previews grouped by company. Each contact
        includes a `has` field listing available data points, a `canReveal`
        field showing what can be unlocked via Enrich, a `roles` array with the
        assigned persona(s), and a `score` (0-1) reflecting relevance to the
        assigned role.


        Use Enrich Contacts with the returned contact `id` to reveal emails and
        phones.


        > **Billing:** Charged per contact returned via the `buyingGroupContact`
        action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V3BuyingGroupRequest'
            example:
              companies:
                - clientReferenceId: comp-ref-1
                  domain: acme.com
                - clientReferenceId: comp-ref-2
                  id: v1.AbCdEfGhIjKlMnOpQrStUvWxYz012345
              personas:
                - decision_maker
                - potential_champion
              contactsLimit: 20
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V3BuyingGroupResponse'
              example:
                requestId: 951d46da-24f9-4608-84bf-5e70a10bf851
                results:
                  - companyId: v1.ocoj3UrkPqHcR8yAEosYFTuVXTH282LP
