      summary: Get Company Signals by IDs
      description: 'Retrieve signals data for a list of company IDs.

        This endpoint allows you to get recent activities and signals for up to 100 companies per request.


        *Endpoint*: **(POST) https://api.lusha.com/api/signals/companies**


        **Default Behavior:**

        - Returns signals from the last 6 months by default

        - Use `startDate` to customize the timeframe

        '
      operationId: getCompanySignalsById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanySignalsByIdRequest'
            examples:
              basicExample:
                summary: Basic request
                value:
                  companyIds:
                  - 3416
                  signals:
                  - websiteTrafficIncrease
                  startDate: '2025-01-01'
                  maxResultsPerSignal: 10
              allSignals:
                summary: Request all signals
                value:
                  companyIds:
                  - 3416
                  - 3417
                  signals:
                  - allSignals
                  maxResultsPerSignal: 10
      responses:
        '200':
          description: Company signals retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanySignalsByIdResponse'
              examples:
