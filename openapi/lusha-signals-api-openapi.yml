                          country: United States
                          state: California
                          signalDate: '2025-06-15'
                          newJobsPostedLast4Weeks: 20
                          historicalAvg: 8
                          changeRatePercent: 150
                          companyName: Lusha
                          domain: lusha.com
                    endDate: '2025-07-31'
                    startDate: '2025-01-01'
                    creditCharged: 1
