  /api/signals/companies/search:
    post:
      tags:
      - Signals
      summary: Search Company Signals
      description: 'Search for company signals using identifiers like domain, company name, or ID.

        This endpoint combines search and signal enrichment in a single request.


        *Endpoint*: **(POST) https://api.lusha.com/api/signals/companies/search**


        **Search Requirements:**

        Each company must have at least one identifier:

        - Company ID (as string)

        - Company name

        - Company domain


        **Default Behavior:**

        - Returns signals from the last 6 months by default

        - Companies are matched based on provided identifiers

        '
      operationId: searchCompanySignals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanySignalsSearchRequest'
            examples:
              searchByDomain:
                summary: Search by domain (id required)
                value:
                  companies:
                  - id: '12344321'
                    domain: lusha.com
                  signals:
                  - itSpendIncrease
                  startDate: '2025-01-01'
                  maxResultsPerSignal: 10
              searchByName:
                summary: Search by company name (id required)
                value:
                  companies:
                  - id: '123123'
                    name: Lusha
                  signals:
                  - allSignals
                  startDate: '2025-01-01'
                  maxResultsPerSignal: 10
              multipleCompanies:
                summary: Search multiple companies with different identifiers
                value:
                  companies:
                  - id: '123123'
                    name: Arcmedix
                  - id: '12344321'
                    domain: lusha.com
                  - id: '1234434421'
                    domain: example.com
                  signals:
                  - itSpendIncrease
                  startDate: '2025-01-01'
                  maxResultsPerSignal: 10
      responses:
        '200':
          description: Company signals search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanySignalsByIdResponse'
              examples:
                multipleSignals:
                  summary: Multiple signal types found via search
                  value:
                    companies:
                      '12344321':
                        companyId: '3416'
                        companyName: Lusha
                        domain: lusha.com
                        commercialActivityNews:
                        - companyId: '3416'
                          companyName: Lusha
                          domain: lusha.com
                          signalId: '1503910'
                          eventType: partnership
                          eventSummary: Lusha announced a strategic partnership with Salesforce.
                          articlePublishedDate: '2025-06-15'
                          articleTitle: Lusha Partners with Salesforce
                          articleHighlight: The partnership enables Salesforce users to access Lusha data directly within their CRM.
                          eventEffectiveDate: '2025-06-10'
                          articleUrl: https://example.com/lusha-salesforce-partnership
                        itSpendIncrease:
                        - companyId: '3416'
                          signalId: '1503903'
                          signalDate: '2025-06-15'
                          estimatedAnnualItSpend: 5000000
                          changeRatePercent: 25
                          companyName: Lusha
                          domain: lusha.com
                    endDate: '2025-07-31'
                    startDate: '2025-01-01'
                    creditCharged: 2
                headcountSignal:
                  summary: Headcount increase signal
                  value:
                    companies:
                      '12344321':
                        companyId: '3416'
                        companyName: Lusha
                        domain: lusha.com
                        headcountIncrease3m:
                        - companyId: '3416'
                          signalId: '1503904'
                          signalDate: '2025-06-15'
                          baselineEmployeesCount: 500
                          newEmployeesCount: 550
                          changeRatePercent: 10
                          companyName: Lusha
                          domain: lusha.com
                    endDate: '2025-07-31'
                    startDate: '2025-01-01'
                    creditCharged: 1
                hiringByDepartment:
                  summary: Department-specific hiring surge
                  value:
                    companies:
                      '12344321':
                        companyId: '3416'
                        companyName: Lusha
                        domain: lusha.com
                        surgeInHiringByDepartment:
                        - signalId: '1503906'
                          companyId: '3416'
