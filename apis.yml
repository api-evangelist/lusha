- aid: lusha:mcp
  name: Lusha MCP Server
  description: >-
    First-party hosted Model Context Protocol server exposing 22 Lusha tools over streamable HTTP.
    Authenticates with OAuth 2.1 (scope `mcp`, PKCE S256, dynamic client registration at
    auth.lusha.com) for the official Claude, ChatGPT and Codex connectors, or with a Lusha API key in
    a lowercase `x-api-key` header for every other client. A local stdio build ships on npm.
  humanURL: https://docs.lusha.com/mcp-docs
