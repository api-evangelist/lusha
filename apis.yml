aid: lusha
url: https://raw.githubusercontent.com/api-evangelist/lusha/refs/heads/main/apis.yml
name: Lusha
kind: company
description: >-
  Lusha is a B2B sales-intelligence platform that sells verified contact and company data, buying
  signals and AI recommendations to revenue teams. Its v3 REST API at api.lusha.com exposes 58
  operations across thirteen resource families — Search, Enrich, Search & Enrich, Prospecting,
  Lookalikes, Buying Group, Contacts Tables, Companies Tables, Signals, Website Visits, Filters,
  Webhooks and Account — behind a single `api_key` header credential, on a search-then-enrich pattern
  where previews are free of PII and reveals spend credits. Lusha also ships a first-party hosted MCP
  server at mcp.lusha.com with 22 tools, OAuth 2.1 discovery and official Claude, ChatGPT and Codex
  connectors, plus HMAC-signed webhooks for real-time signal delivery.
