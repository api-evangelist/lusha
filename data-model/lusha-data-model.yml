lifecycle_pattern:
  name: search -> enrich
  description: >-
    The v3 pattern is two-phase: a search/prospecting/lookalike call returns
    non-PII previews with `has` and `canReveal`, and a follow-up enrich call on
    the returned ids spends credits to reveal emails and phones.
  operations: [searchContacts, prospectingContacts, getContactLookalikes, enrichContacts]
  single_call_alternative: [searchAndEnrichContacts, searchAndEnrichCompanies]
