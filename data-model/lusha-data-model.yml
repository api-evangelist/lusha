description: >-
  Entity graph of the Lusha v3 API, derived from the harvested OpenAPI's schema
  $refs and id-reference fields. Two root entities — Contact and Company — carry
  the whole model; everything else is a projection (preview vs enriched), a
  container (Table), a subscription (Webhook), or a per-call billing record.
  Ids are opaque strings; Lusha does not use typed id prefixes.
identifiers:
  style: opaque string ids
  prefixes: none
  alternate_keys:
    contact: [id, linkedinUrl, email, firstName+lastName+companyName, firstName+lastName+companyDomain]
    company: [id, domain, name]
  correlation:
    field: clientReferenceId
    description: caller-supplied per-item key echoed back on the matching result
  request_correlation:
    field: requestId
    description: returned on the response envelope of most v3 operations
