symbolic_codes:
- code: TABLE_NOT_FOUND
  status: 404
  meaning: The table_id does not exist or is not accessible to this account.
- code: COLUMN_NOT_FOUND
  status: 404
  meaning: The column_id does not exist on the given table.
- code: TABLE_NAME_CONFLICT
